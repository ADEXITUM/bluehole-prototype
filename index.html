            <li>Привяжи катушку (${V.REEL_M} м, с запасной +${V.SPARE_M}) к ходовой или старой линии — «привязка» (E). Дальше линия тянется за тобой.</li>
            <li><b>Обвязывай на поворотах</b> — «обвязка» (E) у стены. Без обвязки линия за углом уходит в камень, и на выходе по ней не пройти.</li>
            <li>Свою катушку начинай <b>у конца старой линии</b> — уйдёшь дальше.</li>
            <li>Катушка кончилась — линия держит (рывок, звук, пустое кольцо). Вернись или «отцепить» (E, держать): конец закреплён, дальше без линии. Это риск.</li>
            <li>Стрелка (Q) — на любую линию в галерее, где решишь (не ближе ${$t.MIN_GAP_M} м к другой; с собой ${$t.COUNT}), указывает к выходу.</li>
          </ul>
          <h4>Ход и муть</h4><ul>
            <li><b>Медленно — чисто.</b> Shift или малый стик не мутят, пока не касаешься камня. Касание мутит тем гуще, чем быстрее.</li>
            <li>Рывок (пробел, ~${j.V_MAX_X.toFixed(1)} м/с вместо ${(j.V_MAX_X*de.SPEED_K).toFixed(1)}) поднимает муть с камня рядом; над илом мутят и сильные удары ласт.</li>
            <li>В плотной мути не видно ничего дальше полуметра. Держись за линию: тик слева или справа — сторона выхода. Нащупывай стрелки.</li>
          </ul>
          <h4>Отказы</h4><ul>
            <li><b>Шипение и струйка пузырей у регулятора</b> — свободная подача. «Вентиль» (V, держать ~${ie.HOLD_S.toFixed(0)} с, плыть нельзя). Не закрыл — газ уходит в ${ie.MULT} раза быстрее. Закрыл сразу — потерял только струйку.</li>
            <li><b>Фонарь моргает и трещит</b> — сейчас погаснет совсем. Запасной есть у всех: «фонарь» (L) — ${st.SPARE_RANGE_M} м, со слотом «мощный запасной» — ${st.SPARE_HI_RANGE_M} м. Без света держись за линию: тик и подсветка, как в мути.</li>
            <li><b>Линия дёрнулась у обвязки</b> — петля зацепила. «Распутать» (R): сразу — ~${dt.WARN_HOLD_S.toFixed(0)} с, затянулась — ~${dt.HOLD_S.toFixed(0)} с. Дёргаться в петле — мутно и тяжело.</li>
          </ul>
          <h4>Газы и MOD</h4><ul>
            <li>MOD на строке газа — его предел глубины. Глубже — отравление: ${ee.SYMPTOMS_MIN_S}–${ee.SYMPTOMS_MAX_S} с признаков, потом судороги. Спасают безопасный газ или подъём.</li>
            <li>Смена — удержание строки ~${U.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала.</b> Оставить его: перейди на донный, потом «оставить здесь» — встанет на линию. На выходе у баллона выбери его строку.</li>
            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
            <li>EAN50 (MOD ${je(Bt.ean50).toFixed(0)} м): у ходовой около ${U.DECO_CLIP_DEPTH_M} м — кнопка «оставить», можно и нести с собой. На подъёме — выбери его строку (у линии — подплыви).</li>
          </ul>
          <h4>Клавиши</h4><ul>
            <li>Телефон: коснись где угодно — там джойстик. Кнопки справа внизу видны, только когда действие возможно.</li>
            <li>ПК: WASD или стрелки, Shift — медленно; F — автоплыв; пробел — рывок; E — привязка, обвязка, «отцепить»; Q — стрелка; M — звук.</li>
            <li>Отказы (кнопки — только пока отказ идёт): V — вентиль, L — запасной фонарь, R — распутать.</li>
            <li>Газ: G — список; держать 1 — донный, 2 — стейдж, 3 — деко; Shift+цифра — оставить этот баллон (и без списка); Esc — закрыть.</li>
          </ul>
