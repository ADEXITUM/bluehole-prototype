            <li><b>Медленно — чисто.</b> Shift или малый стик не мутят, пока не касаешься камня. Касание мутит тем гуще, чем быстрее.</li>
            <li>Волна от ласт тем сильнее, чем быстрее ход: посередине хода полный ход чист, у пола и над илом поднимает муть, в узком проходе — густо.</li>
            <li>Рывок (пробел, ~${it.V_MAX_X.toFixed(1)} м/с вместо ${(it.V_MAX_X*Me.SPEED_K).toFixed(1)}) — чтобы быстро уйти: дышится в ${ue.GAS_MULT.toFixed(0)} раза тяжелее, метр пути выходит в ~${(ue.GAS_MULT*Me.SPEED_K/ue.SPEED_K).toFixed(1)} раза дороже по газу.</li>
            <li>В плотной мути не видно ничего дальше полуметра. Держись за линию: тик слева или справа — сторона выхода. Нащупывай стрелки.</li>
          </ul>
          <h4>Отказы</h4><ul>
            <li><b>Шипение и струйка пузырей у регулятора</b> — свободная подача. «Вентиль» (V, держать ~${me.HOLD_S.toFixed(0)} с, плыть нельзя). Не закрыл — газ уходит в ${me.MULT} раза быстрее. Закрыл сразу — потерял только струйку.</li>
            <li><b>Фонарь моргает и трещит</b> — сейчас погаснет совсем. Запасной есть у всех: «фонарь» (L) — ${dt.SPARE_RANGE_M} м, со слотом «мощный запасной» — ${dt.SPARE_HI_RANGE_M} м. Без света держись за линию: тик и подсветка, как в мути.</li>
            <li><b>Линия дёрнулась у обвязки</b> — петля зацепила. «Распутать» (R): сразу — ~${St.WARN_HOLD_S.toFixed(0)} с, затянулась — ~${St.HOLD_S.toFixed(0)} с. Дёргаться в петле — мутно и тяжело.</li>
          </ul>
          <h4>Газы и MOD</h4><ul>
            <li>MOD на строке газа — его предел глубины. Глубже — отравление: ${Le.SYMPTOMS_MIN_S}–${Le.SYMPTOMS_MAX_S} с признаков, потом судороги. Спасают безопасный газ или подъём.</li>
            <li>Смена — удержание строки ~${q.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала.</b> Оставить его: перейди на донный, потом «оставить здесь» — встанет на линию. На выходе у баллона — «подобрать», потом перейди на него.</li>
            <li><b>«Подобрать» только пристёгивает баллон</b> — дышишь тем же. Дышать им — отдельной сменой газа: на лежащий баллон без подбора не перейти.</li>
            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь: отдельный блок под газами, держать ~${q.DROP_HOLD_S.toFixed(1)} с. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
            <li>EAN50 (MOD ${ze(zt.ean50).toFixed(0)} м): у ходовой около ${q.DECO_CLIP_DEPTH_M} м — кнопка «оставить», можно и нести с собой. На подъёме — выбери его строку; оставил на линии — подплыви, «подобрать», потом смени газ.</li>
          </ul>
          <h4>Клавиши</h4><ul>
            <li>Телефон: коснись где угодно — там джойстик. Кнопки справа внизу видны, только когда действие возможно.</li>
            <li>ПК: WASD или стрелки, Shift — медленно; F — автоплыв; пробел — рывок; E — привязка, обвязка, «отцепить»; Q — стрелка; C — подобрать баллон рядом; M — звук.</li>
            <li>Отказы (кнопки — только пока отказ идёт): V — вентиль, L — запасной фонарь, R — распутать.</li>
            <li>Газ: G — список; держать 1 — донный, 2 — стейдж, 3 — деко (лежит рядом — подобрать); Shift+цифра — оставить этот баллон (и без списка); Esc — закрыть.</li>
          </ul>
