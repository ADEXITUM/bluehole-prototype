          </ul>
          <h4>Отказы</h4><ul>
            <li><b>Шипение и струйка пузырей у регулятора</b> — свободная подача. «Вентиль» (V, держать ~${ye.HOLD_S.toFixed(0)} с, плыть нельзя). Не закрыл — газ уходит в ${ye.MULT} раза быстрее. Закрыл сразу — потерял только струйку.</li>
            <li><b>Фонарь моргает и трещит</b> — сейчас погаснет совсем. Запасной есть у всех: «фонарь» (L) — ${pt.SPARE_RANGE_M} м, со слотом «мощный запасной» — ${pt.SPARE_HI_RANGE_M} м. Без света держись за линию: тик и подсветка, как в мути.</li>
            <li><b>Линия дёрнулась у обвязки</b> — петля зацепила. «Распутать» (R): сразу — ~${Tt.WARN_HOLD_S.toFixed(0)} с, затянулась — ~${Tt.HOLD_S.toFixed(0)} с. Дёргаться в петле — мутно и тяжело.</li>
          </ul>
          <h4>Газы и MOD</h4><ul>
            <li>MOD на строке газа — его предел глубины. Глубже — отравление: ${Ie.SYMPTOMS_MIN_S}–${Ie.SYMPTOMS_MAX_S} с признаков, потом судороги. Спасают безопасный газ или подъём.</li>
            <li>Смена — удержание строки ~${z.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала.</b> Оставить его: перейди на донный, потом «оставить здесь» — встанет на линию. На выходе у баллона — «подобрать», потом перейди на него.</li>
            <li><b>«Подобрать» только пристёгивает баллон</b> — дышишь тем же. Дышать им — отдельной сменой газа: на лежащий баллон без подбора не перейти.</li>
            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь: отдельный блок под газами, держать ~${z.DROP_HOLD_S.toFixed(1)} с. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
            <li>EAN50 (MOD ${Ze(qt.ean50).toFixed(0)} м): у ходовой около ${z.DECO_CLIP_DEPTH_M} м — кнопка «оставить», можно и нести с собой. На подъёме — выбери его строку; оставил на линии — подплыви, «подобрать», потом смени газ.</li>
          </ul>
          <h4>Клавиши</h4><ul>
            <li>Телефон: коснись где угодно — там джойстик. Кнопки справа внизу видны, только когда действие возможно.</li>
            <li>ПК: WASD или стрелки, Shift — медленно; F — автоплыв; пробел — рывок; E — привязка, обвязка, «отцепить»; Q — стрелка; C — подобрать баллон рядом; T — прочесть записку рядом (и закрыть); M — звук.</li>
            <li>Записку читаешь, пока время идёт: дайвер висит на месте, руки заняты. Найденное засчитывается, когда осветил его фонарём; на поверхности — итог и сезон.</li>
            <li>Отказы (кнопки — только пока отказ идёт): V — вентиль, L — запасной фонарь, R — распутать.</li>
            <li>Газ: G — список; держать 1 — донный, 2 — стейдж, 3 — деко (лежит рядом — подобрать); Shift+цифра — оставить этот баллон (и без списка); Esc — закрыть.</li>
          </ul>
