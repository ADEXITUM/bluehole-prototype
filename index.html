        <details class="help"><summary>Справка: линия, муть, отказы, газы, клавиши</summary>
          <h4>Линия</h4><ul>
            <li>Привяжи катушку (${W.REEL_M} м, с запасной +${W.SPARE_M}) к ходовой или старой линии — «привязка» (E). Дальше линия тянется за тобой.</li>

            <li>Свою катушку начинай <b>у конца старой линии</b> — уйдёшь дальше.</li>

          </ul>

          </ul>

            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
