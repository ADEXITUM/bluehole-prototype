          <h4>Линия</h4><ul>
            <li>Привяжи катушку (${U.REEL_M} м, с запасной +${U.SPARE_M}) к ходовой или старой линии — «привязка» (E). Дальше линия тянется за тобой.</li>

          </ul>

            <li>Смена — удержание строки ~${et.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала.</b> Оставить его: перейди на донный, потом «оставить здесь» — встанет на линию. На выходе у баллона выбери его строку.</li>
            <li>EAN50 (MOD ${Oe(kt.ean50).toFixed(0)} м) сам встаёт на ходовую на ${et.DECO_CLIP_DEPTH_M} м; на подъёме подплыви к нему и выбери.</li>
          </ul>

            <li>ПК: WASD или стрелки, Shift — медленно; F — автоплыв (×${dt.TIME_SCALE}); пробел — рывок; E — привязка, обвязка, «отцепить»; Q — стрелка; M — звук.</li>
