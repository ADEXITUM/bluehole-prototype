// Preserve the position of an empty place through saves and kit validation.
function equipmentSlots(slots, allowed) {
  const seen = new Set();
  const result = Array.from(slots.slice(0, Sn)).map(id => {
    if (!allowed.includes(id) || seen.has(id)) return null;
    seen.add(id);
    return id;
  });
  while (result.length && result[result.length - 1] === null) result.pop();
  return result;
}

      c.save();
      poly([[begin,-.8],[end,-.8],...outline.slice().reverse()], ice);
      c.clip();
      for (let i = Math.floor(begin / 1.8); i <= end / 1.8; i++) {
        const x = i*1.8, base = iceDepth(x), offset = noise(i);
        poly([[x-1,-.8],[x+1.2,-.8],[x+.3,base*.55],[x+offset,base+.08]], '#f0f6e925');
        line([[x+1.4,-.65],[x+.35,.24],[x+.6,base*.48],[x+.1,base*.6]],'#507f8f44',.035);
      }
      c.restore();
      line(outline, '#e2f6e5bd', .08);
      line([[begin,-.83],[end,-.83]], '#eff4e6', .14);
    }
    // A flagged, open lead and a physical survey line that ends at the near relay.
    line([[-2.4,.04],[-1.4,.1],[.6,.02],[1.5,.08],[2.4,.04]], '#e0f7e9', .075);
    line([[-3.1,-.85],[-3.1,-2.15]], '#705044', .08);
    poly([[-3.1,-2.12],[-2.25,-1.89],[-3.1,-1.64]], '#cf6844');
    if (d.route==='west') {
      // The winch and hydrophone have separate positions. The sensor hangs in
      // its cradle until the diver clips it, then travels along the laid line.
      line([[-.6,0],[-.6,3.5],[.6,3.5],[.6,0]],'#244953',.09);
      oval(0,3.2,.43,.36,'#b98e51'); oval(0,3.2,.22,.2,'#31474c');
      line([[-22.85,iceDepth(-22.85)],[-22.85,9.6],[-21.3,9.6],[-21.3,iceDepth(-21.3)]],'#7eafa9',.11);
      line([[-22.85,8.75],[-22.5,9.35],[-21.65,9.35],[-21.3,8.75]],'#a2b5a7',.12);
    } else {
      c.beginPath(); c.moveTo(-2.5,1.4); c.quadraticCurveTo(4,6,10,6.2); c.quadraticCurveTo(14,6.7,18,6);
      c.strokeStyle='#dbbb6c'; c.lineWidth=.055; c.stroke();
      for (const [x,y] of [[4,4.63],[10,6.2],[15,6.27]]) {
        poly([[x-.28,y],[x+.18,y-.2],[x+.16,y+.18]], '#f0d596');
      }
      line([[18,iceDepth(18)],[18,5.6]], '#1e4d55', .05);
      c.fillStyle='#142d35'; c.fillRect(17.64,5.55,.72,.95);
      c.fillStyle=d.reading?'#b8d0bf':'#e5b956'; c.fillRect(17.72,5.68,.56,.68);
      line([[17.8,5.95],[18.17,5.95]], '#614d35', .09);
      const foot = bed(48);
      line([[47.1,foot],[47.6,14.5],[48.5,14.45],[49.2,bed(49.2)]],'#91a9a2',.14);
      line([[46.8,foot],[47.7,foot],[48.6,bed(48.6)],[49.5,bed(49.5)]],'#52696e',.19);
      c.fillStyle='#273f45'; c.fillRect(47.25,13.7,1.7,1);
      c.fillStyle='#b6a57f'; c.fillRect(47.28,13.72,1.62,.16);
      c.fillStyle=d.cargo?'#0f2d3a':'#dc8c4e'; c.fillRect(47.6,13.97,.88,.44);
      line([[48.75,13.7],[48.9,13],[48.65,12.5]], '#b4c7c0', .07);
      oval(48.65,12.45,.12,.24,'#cfba8a');
    }
    if (d.line?.points.length) {
      const points = d.line.points.map(p => [p.x,p.y]);
      if (d.line.mode === 'laying') points.push([d.x,d.y]);
      line(points, '#183e49', .16);
      line(points, '#b1edcd', .075);
      const anchor = points[0];
      oval(...anchor, .21,.21,'#204946');
      oval(...anchor, .12,.12,'#e7f8cf');
      // Homeward chevrons follow the actual turns made under the keel.
      for (let i=1; i<points.length; i+=8) {
        const [x,y] = points[i], prev = points[i-1];
        c.save(); c.translate(x,y); c.rotate(Math.atan2(prev[1]-y,prev[0]-x));
        line([[-.16,-.15],[.13,0],[-.16,.15]], '#edffda',.085); c.restore();
      }
      if (d.line.mode === 'return') {
        const p = d.line.points[d.line.cursor];
        c.beginPath(); c.arc(p.x,p.y,.37,0,Math.PI*2); c.lineWidth=.08; c.strokeStyle='#e5ffb8'; c.stroke();
      }
    }
    if (d.route==='west') {
      const p = d.pod ? onLine(d.line,d.pod.at) : hydrophone;
      oval(p.x,p.y,.55,.29,'#edab6a');
      line([[p.x-.35,p.y-.16],[p.x-.34,p.y+.16]],'#795540',.09);
      line([[p.x+.28,p.y-.18],[p.x+.28,p.y+.17]],'#795540',.09);
      oval(p.x,p.y+.33,.25,.16,'#344953');
      if (d.pod && d.pod.at>0) {
        const mark=view.target();
        c.beginPath(); c.arc(mark.x,mark.y,.5,0,Math.PI*2);
        c.lineWidth=.1; c.strokeStyle='#f6d98f'; c.stroke();
      }
    }
    // Suspended flecks ride the two layers at different speeds.
    for (let i = 0; i < 90; i++) {
      const y = noise(i + 149) * 19;
      let x = (noise(i + 71) * 80 + t * clamp((y-8)/4,-1,1) * .27) % 80;
      x = (x + 80) % 80 - 11;
      if (x >= left && x <= right && y > iceDepth(x) && y < bed(x)) {
        line([[x,y],[x+.085,y-.01]],'#d5e8d854',.03);
      }
    }
    // Lamp, tank, regulator hose and two independently beating fins.
    c.save(); c.translate(d.x,d.y); c.scale(d.facing,1); c.rotate(clamp(d.vy*.09,-.34,.34));
    const beam = c.createLinearGradient(.45,0,7,0);
    beam.addColorStop(0,'#fbefc480'); beam.addColorStop(.3,'#f8edb533'); beam.addColorStop(1,'#e5efbd00');
    poly([[.55,-.19],[7,-1.2],[7,1.65],[.55,-.07]], beam);
    for (let i=0; i<2; i++) {
      const beat = Math.sin(t*(d.fast?8.2:5.4)+i*Math.PI)*.21;
      line([[-.37,.08],[-.7,.22+beat],[-1,.12+beat]], i?'#172f38':'#34525a', .16);
      poly([[-.91,.05+beat],[-1.45,.02+beat*1.7],[-1.55,.17+beat*1.8],[-.98,.23+beat]], i?'#9d8859':'#c3ab78');
    }
    oval(-.03,.02,.61,.24,'#122c37',-.08);
    oval(-.17,-.23,.51,.17,'#abbbb2',-.05);
    line([[-.22,-.37],[-.18,-.09]], '#354d54',.13);
    oval(.43,-.14,.255,.24,'#26393b');
    c.fillStyle='#a3c9be'; c.fillRect(.48,-.24,.22,.13);
    line([[.13,.04],[.33,.27],[.69,.17]],'#203c46',.12);
    oval(.71,.16,.1,.075,'#c69a65');
    if (d.cargo) { c.fillStyle='#c68452'; c.fillRect(-.26,.17,.4,.23); }
    c.restore();
    for (let i=0; i<6; i++) {
      const phase = (t*.53+i/6)%1;
      const x = d.x + .56*d.facing - d.vx*phase*.72 + Math.sin(i+t)*.08;
      const y = d.y - .24 - phase*2.3;
      if (y > iceDepth(x) + .08) {
        c.beginPath(); c.arc(x,y,.035+phase*.067,0,Math.PI*2);
        c.strokeStyle='#d7ece799'; c.lineWidth=.025; c.stroke();
      }
    }
    if (d.pulse > 0) {
      c.beginPath(); c.arc(d.x,d.y, .5+((7-d.pulse)*6)%11,0,Math.PI*2);
      c.lineWidth=.045; c.strokeStyle='#a6e5ce80'; c.stroke();
    }
    // Small plate labels keep a consistent pixel size at both viewport scales.
    c.setTransform(ratio,0,0,ratio,0,0);
    function plate(x,y,title) {
      const px=(x-left)*scale, py=(y-top)*scale;
      c.font='600 11px ui-monospace, monospace'; c.textAlign='center';
      const width=c.measureText(title).width+14;
      if (px < -width/2 || px > w+width/2 || py < 10 || py > h-10) return;
      c.fillStyle='#092833d6'; c.fillRect(px-width/2,py-11,width,18);
      c.fillStyle='#e5ebe0'; c.fillText(title,px,py+2);
    }
    plate(0,1.1,'МАЙНА');
    if (d.route==='west') {
      plate(-13,6.4,'ЗАПАДНАЯ ПОЛКА');
      plate(-22,7.9,'ГИДРОФОН');
      if (!d.line.points.length) plate(0,4.5,'БАРАБАН');
    } else {
      plate(18,7.45,'РЕПЕР');
      if (range(d,recorder)<11 || d.reading || view.charted || d.cargo) plate(48,11.5,'ПОСТ 04');
      if (left < 33 && right > 33) plate(32,5.6,'ТОРОС');
      if (d.pulse > 0) plate(33,11.55,'ПРОХОД · 11 М');
    }
    if (d.line?.points.length) plate(d.line.points[0].x,d.line.points[0].y-.75,'УЗЕЛ');
  }

  globalThis.IceDive = IceDive;
})();

function drawPhotoMark(ctx, x, y, small) {
  ctx.save();
  const radius = small ? 6 : 10;
  ctx.strokeStyle = "#9a4531";
  ctx.lineWidth = small ? 1.5 : 2;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, 2 * Math.PI);
  ctx.stroke();
  ctx.font = "bold " + (small ? 10 : 13) + "px Georgia, serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#ede3ca";
  ctx.strokeText("цель", x + radius, y - 2);
  ctx.fillStyle = "#853b2b";
  ctx.fillText("цель", x + radius, y - 2);
  ctx.restore();
}

function surveyElement(tag, text, className) {
  const element = document.createElement(tag);

  if (className) element.className = className;

}

// Presentation priority is not evidence. Accept older checkpoint keys that
// serialized the entire journal entry without turning metadata into new facts.
function surveyEvidenceKey(entry){
  const title=entry.source==="Наблюдение"&&entry.title==="Схема у конца линии"?"Светлый прямоугольник":entry.title;
  return JSON.stringify({title,source:entry.source});
}

class ExpeditionProgress {

    this.observed=new Set(saved?.version===2&&Array.isArray(saved.observed)?saved.observed.filter(id=>xt().finds.some(f=>f.id===id)):[]);
    this.legacyUnlocked=new Set(saved?.version===2&&Array.isArray(saved.legacyUnlocked)?saved.legacyUnlocked.filter(id=>expeditionChapters.some(p=>p.id===id)):[]);
    this.found=new Set();this.notes=new Set();
    if(saved?.version!==2){
      const old=new Set(Bn().found),index=expeditionChapters.findIndex(p=>p.id===this.chapterId);
      if(index>=1||old.has("curtain")&&old.has("dome"))this.legacyUnlocked.add("traces");
      if(index>=2||old.has("tank81")&&old.has("reel81"))this.legacyUnlocked.add("fate");
    }
    this.refresh();
    if(!valid)for(const plan of expeditionChapters)if(this.isComplete(plan.id))this.seenIntro.add(plan.id);
    this.save();
  }
  get activeChapter(){return expeditionChapters.find(p=>p.id===this.chapterId)??expeditionChapters[0];}
  hasPhoto(id){return this.found.has(id);}
  knows(id){return this.observed.has(id)||this.found.has(id);}
  hasAnyPhoto(ids){return ids.some(id=>this.found.has(id));}
  hasAnyNote(ids){return ids.some(id=>this.notes.has(id));}
  get isFinished(){return this.found.has("body")&&(this.found.has("slate81")||this.notes.has("n6"));}
  canEnter(id){
    if(id==="survey")return true;
    if(this.legacyUnlocked.has(id))return true;
    if(id==="traces")return this.hasAnyPhoto(["cache","tank81","reel81","slate81","body"])||this.hasAnyNote(["n3","n4","n5","n6"]);
    if(id==="fate")return this.hasAnyPhoto(["reel81","slate81","body"])||this.hasAnyNote(["n5","n6"]);
    return false;
  }
  isComplete(id){return id==="survey"?this.canEnter("traces"):id==="traces"?this.canEnter("fate"):id==="fate"?this.isFinished:false;}
  nextPlan(){return expeditionChapters.find(p=>this.canEnter(p.id)&&!this.isComplete(p.id))??expeditionChapters.at(-1);}
  select(id){this.refresh();if(!this.canEnter(id))return false;this.chapterId=id;this.save();return true;}
  hasSeenIntro(id=this.chapterId){return this.seenIntro.has(id);}

  remember(observed,kept){if(!kept)return;for(const id of observed)if(xt().finds.some(f=>f.id===id))this.observed.add(id);this.save();}
  evidenceKeys(){return new Set(this.journal().map(surveyEvidenceKey));}
  preparation(){

      ?"Для глубокого маршрута доступны спарка и улучшенный запасной фонарь. Спарка увеличивает запас газа; яркий резервный свет занимает одно из двух мест. Выбери комплект перед выходом."

      return route("Проверить верхний вход","На схеме Корнеева отмечен вход на 18 м. Начнём с ближайшего участка.","Спустись вдоль верёвки к 18 м и поверни направо. Осмотри начало хода; одна запись или снимок — уже полезный выход.",{x:51,y:18},false,"Что осталось от разведки Корнеева?");

  debrief(before){

// The first outing is optional preparation, not a fourth chapter or a gate.
const firstDiveTarget = {
  id:"entry-tag", short:"Жёлтая метка", leg:"Под буем · 6 м",
  clue:"Под оранжевым буем вниз идёт верёвка. На 6 м к ней прикреплена жёлтая метка. Сфотографируй её и вернись к лодке.",
};
const firstDiveIntro = [
  {speaker:"Напарник",text:"У нас старая схема Корнеева. Он прошёл здесь в 1996-м, но до конца пещеру не обследовал. Мы проверим, что осталось от его маршрута."},
  {speaker:"Напарник",text:"Комплект собран. Под буем есть жёлтая метка на линии. Сфотографируй её и возвращайся. Рассмотрим снимок на лодке, прежде чем идти под свод."},
];

function scoutedBeyondBuoy(observed) {
  if (!observed || !(Array.isArray(observed) || typeof observed.has === 'function')) return false;
  return [...observed].some(id => id !== firstDiveTarget.id && xt().finds?.some(find => find.id === id));
}

class FirstDiveProgress {
  constructor(){
    this.key=qt("first-dive");
    const saved=Me(this.key),season=Bn();
    // Existing expeditions keep their progress and never acquire a new chore.
    this.completed = saved?.version === 1
      ? saved.completed === true || eo().notes.length > 0 || scoutedBeyondBuoy(Me(qt('expedition'))?.observed)
      : season.dives > 0 || season.found.length > 0;
    this.save();
  }
  get active(){return xt().id==="hub"&&!this.completed;}
  finish(kept,finds,notes=new Set(),observed){
    if(!this.active||!kept||(!finds.length&&!notes.size&&!scoutedBeyondBuoy(observed)))return false;
    this.completed=true;this.save();return true;
  }
  reset(){this.completed=false;this.save();}
  save(){de(this.key,{version:1,completed:this.completed});}
}

function firstAscentControl(keyboard) {
  return keyboard ? "Держи Shift и ↑ для медленного подъёма к бую."
    : "К бую — сдвинь палец вверх до половины круга джойстика.";
}

function firstDiveHint(state,shots,keyboard,notes,observed){
  if(notes?.size)return "Запись прочитана. Уже можно возвращаться: по линии к шахте, затем вверх к бую.";
  if(shots.some(shot=>shot.finds.length))return "Снимок есть. "+firstAscentControl(keyboard);
  if(scoutedBeyondBuoy(observed))return "Есть новый ориентир. Вернись по линии к бую, чтобы отметить его на лодке.";
  if(state.depth>9)return "Метка осталась выше, на 6 м под буем. Для первого снимка достаточно вернуться к ней.";
  if(state.depth<2)return keyboard
    ?"Плыви стрелками или WASD к жёлтой метке под буем. Для медленного хода держи Shift."
    :"Веди пальцем по воде в сторону жёлтой метки под буем. Чем меньше отклонение, тем медленнее плывёшь.";
  if(shots.length)return "Метка не попала в кадр. Подплыви ближе, направь на неё свет и сними ещё раз.";
  return keyboard
    ?"Наведи свет на жёлтую метку: держи Z и направление. Затем удерживай X до вспышки. Между снимками дождись заполнения кольца камеры."
    :"Слегка отклони палец к жёлтой метке, чтобы навести свет. Удерживай «Камеру» до вспышки. Между снимками дождись заполнения кольца камеры.";
}

function firstDiveLesson(state,shots,keyboard,notes,observed){
  const id=notes?.size||shots.some(shot=>shot.finds.length)||scoutedBeyondBuoy(observed)?'first-return':state.depth>9?'first-above':state.depth<2?'first-move':shots.length?'first-retry':'first-camera';
  return {id,text:firstDiveHint(state,shots,keyboard,notes,observed)};
}

// Learning is separate from story evidence. Reading a briefing is not the same
// as performing the action in water. Only a completed return banks practice.
class ExpeditionLearning {
  constructor(){
    this.key=qt("learning");const saved=Me(this.key);
    this.briefed=new Set(saved?.version===1?saved.briefed??[]:[]);
    this.practiced=new Set(saved?.version===1?saved.practiced??[]:[]);
    this.seen=new Set(saved?.version===1?saved.seen??[]:[]);
    this.presented=new Set(saved?.version===1?saved.presented??saved.seen??[]:[]);
  }
  save(){de(this.key,{version:1,briefed:[...this.briefed],practiced:[...this.practiced],seen:[...this.seen],presented:[...this.presented]});}
  present(id){if(!this.presented.has(id)){this.presented.add(id);this.save();}}
  remember(id){if(!this.seen.has(id)){this.seen.add(id);this.presented.add(id);this.save();}}
  brief(id){this.briefed.add(id);this.save();}
  bank(actions,kept){if(kept){for(const id of actions)this.practiced.add(id);this.save();}}
  reset(){this.briefed.clear();this.practiced.clear();this.seen.clear();this.presented.clear();this.save();}
  nextBrief(progress,first){
    if(first)return null;
    if(!this.briefed.has("return"))return "return";
    const deep=progress.chapterId!=="survey",beyond=deep||progress.knows("dome")||progress.knows("cache")||progress.notes.has("n2");
    if(beyond&&!this.briefed.has("line"))return "line";
    if(deep&&!this.briefed.has("stop"))return "stop";
    if(progress.chapterId==="fate"&&!this.briefed.has("backup"))return "backup";
    return null;
  }
}

function surveyReadiness(progress,plan,first=false){
  if(first)return [];
  const long=progress.intention().long,deep=progress.chapterId!=="survey";
  const beyond=deep||progress.knows("dome")||progress.knows("cache")||progress.notes.has("n2");
  const items=[];
  if(long&&plan.back!=="twin")items.push({id:"twin",title:"Для дальнего пути — спарка",text:"В одном баллоне вдвое меньше газа. С ним лучше ограничиться короткой разведкой и развернуться раньше."});
  if(beyond&&!plan.slots.includes("reel"))items.push({id:"reel",title:"В комплекте нет катушки",text:"Следуй готовой линии и возвращайся у её конца. Чтобы продолжить за ним, нужна своя линия."});
  return items;
}

// A small instrument rehearsal on the boat. It does not grant real stop
// experience, equipment, story progress, or change the simulation's tissues.
class StopRehearsal {
  constructor(){this.depth=12;this.remaining=3;this.done=false;}
  move(depth){if(!this.done)this.depth=depth;}
  wait(){if(this.depth===9&&!this.done){this.remaining--;this.done=this.remaining===0;}return this.done;}
  get text(){return this.done?"Остановка снята. Теперь можно продолжить подъём.":this.depth<9?"Ты выше скобки. Вернись на 9 м — здесь остановка не идёт.":this.depth>9?"На приборе остановка 9 м. Поднимись к этой отметке.":`Ты в скобке. «Ждать» ускоряет время. Осталось ${this.remaining}.`;}
}

// These lessons used to have two independent presenters. Keep their old read
// receipts, but let a single queue own text and time on screen.
const surveyGuideCovers={entry:['turnMarks'],turn:['turnHit'],'line-end':['tie'],'line-started':['tieOffHint'],shaft:['ascent']};
const surveyGuideOwns=new Set(['camera','turnMarks','turnHit','tie','tieOffHint','deco','wait','ruler','ppo2']);
class SurveyDiveGuide {
  constructor(learning,chapter){
    this.learning=learning;this.chapter=chapter;this.actions=new Set();this.queue=[];this.shown=new Set();
    this.active=null;this.until=0;this.bandSeconds=0;this.wasStop=false;this.returned=false;this.turnSeen=false;this.far=false;this.lightTriggered=false;
    this.clock=0;this.gapUntil=0;
  }
  learned(id){
    if(['turn','stop-clear'].includes(id))return false; // Actual events recur; explanations do not.
    return this.learning.presented.has(id)||this.understood(id);
  }
  understood(id){
    return this.learning.seen.has(id)||
      id==='line-end'&&this.learning.practiced.has('line-start')||
      ['line-started','line-fixed'].includes(id)&&this.learning.practiced.has('line-fixed');
  }
  enqueue(id,text,priority=0){if(!this.learned(id)&&!this.shown.has(id)&&this.active?.id!==id&&!this.queue.some(item=>item.id===id))this.queue.push({id,text,priority});}
  importReveal(reveal,state,eligible){
    for(const [id,covers] of Object.entries(surveyGuideCovers)){
      if(id!=='turn'&&!this.learning.presented.has(id)&&covers.some(key=>reveal.mem.said.has(key)))this.learning.remember(id);
    }
    for(const id of reveal.pending){
      const def=As(id);
      if(!def?.line||surveyGuideOwns.has(id)||reveal.mem.said.has(id)||!this.contextRelevant(def,state,eligible))continue;
      this.enqueue('hint:'+id,typeof def.line==='function'?def.line(state):def.line,0);
    }
  }
  contextRelevant(def,state,eligible){
    if(!def||!eligible(def))return false;
    if(def.id==='auto')return Wt(state);
    if(['gasMenu','ean50Hint'].includes(def.id))return Fu(state);
    return true;
  }
  present(item,reveal){
    if(item.announced)return;
    item.announced=true;
    this.shown.add(item.id);
    if(!['turn','stop-clear'].includes(item.id))this.learning.present(item.id);
    if(!reveal)return;
    const ids=item.id.startsWith('hint:')?[item.id.slice(5)]:surveyGuideCovers[item.id]??[];
    for(const id of ids){
      reveal.mem.said.add(id);reveal.pending=reveal.pending.filter(key=>key!==id);
      if(As(id)?.lesson)reveal.onLessonRead?.(As(id).lesson);
    }
    if(ids.length)reveal.persist?.(reveal.mem);
  }
  complete(item){if(!['turn','stop-clear'].includes(item.id))this.learning.remember(item.id);}
  relevant(item,state,world,eligible){
    const id=item.id;
    if(id.startsWith('first-'))return id===this.firstLessonId;
    if(id.startsWith('hint:'))return this.contextRelevant(As(id.slice(5)),state,eligible);
    if(id==='entry')return Wt(state)&&state.ruleT!==null;
    if(id==='turn')return Wt(state)&&state.tanks.some(t=>t.id==='back'&&t.bar<=t.marks?.[0]);
    if(id==='shaft')return !Wt(state)&&state.depth>2;
    if(id==='line-end')return state.line.reel==='off'&&(!world||world.olds.some(line=>Math.hypot(line.pts.at(-1).x-state.diver.x,line.pts.at(-1).y-state.diver.y)<2.4));
    if(id==='line-started')return state.line.reel==='live'&&state.stats.ties===0;
    if(id==='silt')return state.siltHere>=U.MURKY;
    if(id==='stop')return state.stop>0&&!Wt(state);
    return true;
  }
  step(state,world){
    const tank=state.tanks.find(t=>t.id==="back"),turn=tank?.marks?.[0];
    if(state.siltHere>=U.MURKY)this.enqueue('silt','Это ил: ласты у дна поднимают взвесь, которая закрывает обзор и засвечивает снимки. Отпусти движение, дай ей осесть. Дальше двигайся медленно, держась линии и выше дна.',6);
    if(state.ruleT!==null){
      this.enqueue("entry",`Под сводом путь наверх — обратно по линии. Отметка разворота: ${Math.round(turn??0)} бар. Можно вернуться раньше, даже без снимка.`,2);
      if(Number.isFinite(turn)&&tank.bar<=turn){this.turnSeen=true;this.enqueue("turn","Газ дошёл до отметки разворота. К выходу по линии.",8);}
    }
    if(state.ruleT!==null&&!Wt(state)&&state.depth>2){this.returned=true;this.enqueue("shaft","Ты в шахте. Поднимайся вдоль верёвки к бую. Красные стрелки означают слишком быстрый подъём; на клавиатуре держи Shift.",3);}
    const nearest=world.olds.map(line=>({line,point:line.pts.at(-1)})).find(({point})=>Math.hypot(point.x-state.diver.x,point.y-state.diver.y)<2.4);
    if(nearest&&state.line.reel==="off")this.enqueue("line-end",state.line.capacity>0?"Здесь старая линия заканчивается. Перед продолжением удержи «Начать линию» или E. На повороте у стены закрепи её той же кнопкой.":"Здесь старая линия заканчивается. Катушки с собой нет: возвращайся по готовому пути. Продолжение можно подготовить на лодке.",4);
    if(state.line.parent&&state.line.reel==="live"){
      this.actions.add("line-start");
      this.learning.remember('line-end');
      this.enqueue("line-started","Своя линия идёт за тобой. У стены на повороте удержи «Закрепить» или E. По этой нити возвращайся к старой линии.",4);
      if(state.stats.ties>0){this.actions.add("line-fixed");this.learning.remember('line-started');this.enqueue("line-fixed","Линия закреплена. Этот участок останется в пещере к следующему выходу.",2);}
    }
    if(state.stop>0){
      this.wasStop=true;
      if(wn(state)){
        this.bandSeconds+=bt.DT;state.stats.stopServedS=this.bandSeconds;
      }
    }
    if(this.wasStop&&state.stop===0&&this.bandSeconds>=1){
      this.actions.add("stop");this.enqueue("stop-clear","Остановки пройдены. Продолжай медленный подъём к бую.",7);
    }
    for(const event of state.events){if(event.type==="fail"&&event.kind==="light"&&event.phase==="fixed")this.actions.add("backup");}
    if(state.depth>30&&state.diver.x>65)this.far=true;
  }
  canComplicate(state,world){
    if(this.chapter!=="fate"||!this.learning.briefed.has("backup")||!this.learning.practiced.has("stop")||this.learning.practiced.has("backup")||this.lightTriggered||!this.far)return false;
    if(state.phase!=="dive"||state.dying||state.blind||state.siltHere>.1||Object.values(state.alarms).some(Boolean)||state.fail.list.some(f=>f.phase!=="fixed"))return false;
    if(state.depth<30||state.depth>49||state.diver.x>63||state.diver.vx>=-.1||state.tanks.find(t=>t.id==="back").bar<70)return false;
    const lines=[...world.olds,...state.laid];
    if(state.line.parent)lines.push({pts:Er(state.line)});
    return lines.some(line=>(hn(line.pts,state.diver)?.dist??Infinity)<1.3);
  }
  message(state,delta=null,world=null,reveal=null,eligible=()=>true){
    // Explain the instrument once. Subsequent stops remain visible on the HUD.
    if(state.stop>0&&!Wt(state)){
      const text=state.depth<Math.max(state.ceiling,state.stop-ut.BAND_ABOVE_M)
        ?`Ты выше остановки. Опустись к скобке ${state.stop} м и удерживай глубину. В скобке «Ждать» или H ускоряет время.`
        :state.depth<=state.stop+ut.BAND_BELOW_M
          ?`Остановка ${state.stop} м. Оставайся в скобке и нажми «Ждать» или H. Когда прибор снимет её, продолжай подъём.`
          :`На подъёме нужна остановка ${state.stop} м. Поднимайся к скобке на шкале. Внутри нажми «Ждать» или H; продолжай подъём, когда остановка снимется.`;
      this.enqueue('stop',text,7);
      if(this.active?.id==='stop')this.active.text=text;
    }
    const clock=delta===null?(state.tWall??state.t):(this.clock+=Math.min(delta,.1));
    this.queue=this.queue.filter(item=>!this.learned(item.id)&&this.relevant(item,state,world,eligible));
    if(this.active&&(this.understood(this.active.id)||!this.relevant(this.active,state,world,eligible))){this.active=null;this.gapUntil=clock+5;}
    if(this.active&&clock>=this.until){this.complete(this.active,reveal);this.active=null;this.gapUntil=clock+7;}
    const urgent=this.queue.find(item=>item.priority>=6);
    if(urgent&&this.active&&urgent.priority>this.active.priority)this.active=null;
    if(!this.active&&(clock>=this.gapUntil||urgent)){
      this.queue.sort((a,b)=>b.priority-a.priority);this.active=this.queue.shift()??null;
      if(this.active)this.until=clock+9;
    }
    if(this.active)this.present(this.active,reveal);
    return this.active?.text??null;
  }
  report(state,kept){
    if(!kept){
      const cause=state.outcome?.cause??"";
      if(cause.includes("deco"))return "Для повторного выхода сократи время в глубине и сохрани газ на остановки. Прежние снимки и записи остались на лодке.";
      if(cause.includes("oog"))return "На следующем выходе развернись раньше. Для длинного маршрута возьми спарку; старый альбом сохранён.";
      return "Прежний альбом сохранён. Повтори короткий знакомый участок и проверь комплект перед продолжением.";
    }
    if(this.actions.has("stop"))return "Остановки пройдены. Теперь понятна задача газа подъёма: он сокращает их длительность.";
    if(this.actions.has("line-fixed"))return "Закреплённая линия осталась в пещере. Следующий выход можно начать по уже подготовленному пути.";
    if(this.returned&&this.turnSeen)return "Ты вернулся после отметки разворота. Проверь остаток газа: против течения или в мути разворачивайся раньше.";
    if(this.returned)return "Ты проверил путь и вернулся с запасом. Короткая разведка тоже помогает подготовить продолжение.";
    return "";
  }
}

      this.content.append(surveyElement("p","У конца старой линии удержи «Начать линию» или E. Нить пойдёт за тобой."),surveyElement("p","На повороте приблизься к стене и удержи «Закрепить» или E. Закреплённый путь сохранится после возвращения."),surveyElement("p","Без катушки остановись у конца готовой линии. Это тоже полезная разведка.","preflight-note"));
      button("Понятно · продолжить",done,true);
    }else if(id==="stop"){
      this.rehearsal=new StopRehearsal();
      this.content.append(surveyElement("p","В глубине прибор может назначить остановку. Покажет её глубину и время; на подъёме нужно остаться в скобке."));
      this.preview=surveyElement("div","","stop-rehearsal");this.preview.setAttribute("aria-label","Проверка прибора на лодке");
      this.preview.innerHTML='<small>Проверка прибора на лодке</small><div class="stop-display"><span>ОСТАНОВКА<strong>9 м</strong></span><span class="stop-count"></span></div><div class="stop-depths"></div><p class="stop-feedback" role="status"></p>';
      this.content.append(this.preview);
      for(const depth of [6,9,12]){const b=surveyElement("button",depth+" м");b.addEventListener("click",()=>{this.rehearsal.move(depth);this.renderStop();});b.dataset.depth=String(depth);this.preview.querySelector('.stop-depths').append(b);}
      this.waitButton=button("Ждать",()=>{
        if(this.timer)return;
        const tick=()=>{this.timer=null;this.rehearsal.wait();if(!this.rehearsal.done)this.timer=setTimeout(tick,300);this.renderStop();};
        this.timer=setTimeout(tick,300);this.renderStop();
      },true);
      this.continueButton=button("К погружению",done,true);this.renderStop();
    }else{
      this.content.innerHTML='<div class="backup-rehearsal" role="img" aria-label="Запасной фонарь выключен"><i></i><canvas width="280" height="240" aria-hidden="true"></canvas></div>';
      const lampCanvas=this.content.querySelector('canvas'),ctx=lampCanvas.getContext('2d');
      ctx.scale(2,2);ctx.translate(70,60);ctx.rotate(Math.PI/2+.35);
      paintEquipmentItem(ctx,this.game.planScreen.current.slots.includes('light')?'light':'baseLight',-50,-50,100);
      this.content.append(surveyElement("p","Если основной свет мигает или погас, удерживай «Фонарь» или L до завершения кольца. Запасной фонарь уже на тебе."));
      const test=button("Проверить запасной фонарь",()=>{
        const lamp=this.content.querySelector('.backup-rehearsal');lamp.classList.add('lit');lamp.setAttribute('aria-label','Запасной фонарь горит');
        test.hidden=true;this.content.append(surveyElement("p","Резерв включён. В воде после отказа поворачивай к выходу; улучшенный резерв светит дальше стандартного.","preflight-note"));
        button("Свет проверен · продолжить",done,true);
      },true);
    }
    this.title.focus({preventScroll:true});
  }
  renderStop(){
    const model=this.rehearsal;
    this.preview.querySelector('.stop-feedback').textContent=model.text;
    this.preview.querySelector('.stop-count').textContent=model.done?"Можно выше":model.remaining+" с";
    for(const button of this.preview.querySelectorAll('[data-depth]')){
      button.setAttribute('aria-pressed',String(Number(button.dataset.depth)===model.depth));button.disabled=model.done||!!this.timer;
    }
    this.preview.dataset.band=String(model.depth===9);this.preview.dataset.done=String(model.done);
    this.waitButton.hidden=model.done;this.waitButton.disabled=model.depth!==9||!!this.timer;
    this.waitButton.textContent=this.timer?"Ждём…":"Ждать";
    this.continueButton.hidden=!model.done;
  }
}

// One boat geometry for the first-person hub and the view from the water.
// Coordinates: x across the deck, y up, z from stern to bow.
class ExpeditionBoatModel {
  constructor() {
    this.environment = {setting: "boat"};
    this.buildScene();
  }

  polygon(points,color,detail=null,stroke=null) {
    this.mesh.push({points,color,detail,stroke,layer:this.layer??0});
  }

  box(x,y,z,w,h,d,color) {
    const x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2;
    this.polygon([[x0,y,z0],[x0,y+h,z0],[x1,y+h,z0],[x1,y,z0]],this.tint(color,.73));
    this.polygon([[x0,y,z1],[x0,y+h,z1],[x0,y+h,z0],[x0,y,z0]],this.tint(color,.59));
    this.polygon([[x1,y,z0],[x1,y+h,z0],[x1,y+h,z1],[x1,y,z1]],this.tint(color,.85));
    this.polygon([[x1,y,z1],[x1,y+h,z1],[x0,y+h,z1],[x0,y,z1]],this.tint(color,.68));
    this.polygon([[x0,y+h,z0],[x0,y+h,z1],[x1,y+h,z1],[x1,y+h,z0]],color);
  }

  tint(hex,k) {
    const rgb=hex.startsWith("#") ? dn(hex) : hex.match(/[\d.]+/g).slice(0,3).map(Number);

// Orthographic view of the exact mesh used by SurfaceScene, cached at game scale.
// The boat is visual only; it cannot block the diver or change surfacing physics.
let diveBoatSprite = null;
function getDiveBoatSprite(zoom) {
  const density = Math.max(32, Math.ceil(zoom / 16) * 16);
  if (diveBoatSprite?.density === density) return diveBoatSprite;
  const model = new ExpeditionBoatModel();
  const project = ([x,y,z]) => ({x: -(z+1.3)*.6+x*.055, y: (.1-y+x*.12)*.6, z: -x+z*.06});
  const faces = model.mesh.map(face => ({...face, projected: face.points.map(project)}));
  // In side view the near pontoon must occlude legs and equipment naturally.
  faces.sort((a,b) => b.projected.reduce((s,p)=>s+p.z,0)/b.points.length-a.projected.reduce((s,p)=>s+p.z,0)/a.points.length || a.layer-b.layer);
  const points=faces.flatMap(face=>face.projected);
  const x=Math.min(...points.map(p=>p.x))-.1, y=Math.min(...points.map(p=>p.y))-.1;
  const w=Math.max(...points.map(p=>p.x))-x+.1, h=Math.max(...points.map(p=>p.y))-y+.1;
  const canvas=document.createElement("canvas");
  canvas.width=Math.ceil(w*density); canvas.height=Math.ceil(h*density);
  const ctx=canvas.getContext("2d");
  ctx.setTransform(density,0,0,density,-x*density,-y*density);
  ctx.lineJoin="round";ctx.lineCap="round";
  for(const face of faces) {
    const p=face.projected;
    ctx.beginPath();p.forEach((point,i)=>i?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));
    if(face.line) {ctx.strokeStyle=face.color;ctx.lineWidth=Math.max(.008,face.width*.6);ctx.stroke();continue;}
    ctx.closePath();
    let fill=face.color;
    if(face.smooth) {
      const a=p[0],b=p[face.smooth.edge];
      fill=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
      fill.addColorStop(0,face.color);fill.addColorStop(1,face.smooth.to);
    }
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle=fill;ctx.lineWidth=.006;ctx.stroke();
  }
  ctx.globalCompositeOperation="source-atop";
  ctx.fillStyle="rgba(58,170,196,.15)";ctx.fillRect(x,0,w,h);
  return diveBoatSprite={canvas,density,x,y,w:canvas.width/density,h:canvas.height/density};
}

// The pocket is part of the cave art. The normal lamp, flash, silt and
// darkness passes light it before the camera takes its picture.
function drawSurveyDome(ctx, view, bell, seconds, cellsPerMetre) {
  const columns = bell.cols;
  const cell = 1 / cellsPerMetre;
  const surface = bell.f.y;
  ctx.save();
  ctx.translate(-view.ox * view.zoom, -view.oy * view.zoom);
  ctx.scale(view.zoom, view.zoom);

  const air = ctx.createLinearGradient(0, surface - 1, 0, surface + 0.04);
  air.addColorStop(0, "#17242d");
  air.addColorStop(0.42, "#475657");
  air.addColorStop(0.76, "#869b94");
  air.addColorStop(0.88, "#dde6d5");
  air.addColorStop(1, "#668995");

  // Follow the sampled roof all the way to each contact with the rock.
  // Where the roof divides the pocket, the mirror must break as well.
  let start = 0;
  while (start < columns.length) {
    let end = start + 1;
    while (end < columns.length && columns[end].i === columns[end - 1].i + 1) end++;
    const left = columns[start].i * cell;
    const right = (columns[end - 1].i + 1) * cell;
    const width = right - left;
    const ripple = x => surface
      + 0.035 * Math.sin((x - left) * 3.2 + seconds * 0.75)
      + 0.018 * Math.sin((x - left) * 6.8 - seconds * 1.15);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(left, ripple(left));
    for (let j = start; j < end; j++) {
      ctx.lineTo((columns[j].i + 0.5) * cell, columns[j].j0 * cell);
    }
    ctx.lineTo(right, ripple(right));
    for (let j = end - 1; j >= start; j--) {
      const x = columns[j].i * cell;
      ctx.lineTo(x, ripple(x));
    }
    ctx.closePath();
    ctx.fillStyle = air;
    ctx.fill();
    ctx.clip();

    if (width > 1) {
      // Broken reflections sit inside the mirror. Their widths contract and
      // expand while the lower edge stays nearly horizontal.
      for (let j = 0; j < 5; j++) {
        const phase = seconds * 0.65 + j * 2.3;
        const x = left + width * (j + 0.6) / 5;
        const y = surface - 0.18 - 0.07 * Math.sin(phase);
        ctx.fillStyle = j % 2 === 0 ? "#e2e6d7" : "#77959a";
        ctx.beginPath();
        ctx.ellipse(x, y, width * (0.07 + 0.025 * Math.sin(phase)), 0.035, -0.045, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(left, ripple(left));
    for (let j = start; j < end; j++) {
      const x = (columns[j].i + 1) * cell;
      ctx.lineTo(x, ripple(x));
    }
    ctx.strokeStyle = "#19343c";
    ctx.lineWidth = 0.22;
    ctx.stroke();
    ctx.strokeStyle = "#f5f1dc";
    ctx.lineWidth = 0.07;
    ctx.stroke();

    // A small train of bubbles flattens into the interface, so the silver
    // strip reads as trapped gas even when the diver holds the lamp still.
    if (width > 2) {
      const sourceX = left + width * 0.62;
      for (let j = 0; j < 3; j++) {
        const rise = (seconds / 3 + j / 3) % 1;
        const x = sourceX + 0.12 * Math.sin(rise * 5 + j);
        const y = ripple(x) + 2.25 * (1 - rise);
        const contact = Math.max(0, (rise - 0.82) / 0.18);
        const radius = (0.07 + 0.07 * rise) * Math.min(1, rise * 8);
        ctx.beginPath();
        ctx.ellipse(x, y, radius * (1 + contact), radius * (1 - 0.75 * contact), 0, 0, Math.PI * 2);
        ctx.fillStyle = "#476e79";
        ctx.fill();
        ctx.strokeStyle = "#c6e1de";
        ctx.lineWidth = 0.025;
        ctx.stroke();
      }
    }
    start = end;
  }
  ctx.restore();
}

function changeSurveyEquipment(plan, kit, change) {
  const next={...plan,slots:[...plan.slots]};
  if(change.back){if(!kit.backs.includes(change.back))return null;next.back=change.back;}
  if(Number.isInteger(change.index)){
    if(change.index<0||change.index>=Sn)return null;
    if(change.item===null)next.slots[change.index]=null;
    else {
      if(!kit.slots.includes(change.item))return null;
      const existing=next.slots.indexOf(change.item);
      if(existing>=0&&existing!==change.index)next.slots[existing]=next.slots[change.index]??null;
      while(next.slots.length<=change.index)next.slots.push(null);
      next.slots[change.index]=change.item;
    }
  } else if(change.slot){
    if(!kit.slots.includes(change.slot))return null;
    if(next.slots.includes(change.slot))next.slots[next.slots.indexOf(change.slot)]=null;

      else {if(next.slots.length>=Sn)return null;next.slots.push(change.slot);}
    }
  }
  next.slots=equipmentSlots(next.slots,kit.slots);
  return next;
}

    const restore=surveyElement('button','Вернуть предыдущее прохождение','link');
    restore.hidden=!Me(qt('previous-expedition'));restore.addEventListener('click',()=>showExpeditionReset(true));settings.append(restore);

    this.render();
  }

  render() {
    const focused = document.activeElement?.closest("[data-v],[data-slot]");
    const restore = focused && this.root.contains(focused) ? {
      slot: focused.dataset.slot,
      group: focused.parentElement?.dataset.k,
      value: focused.dataset.v,
    } : null;
    super.render();
    // The base constructor renders once before the dock controls exist.
    if (!this.routeSlot) return;
    this.renderRule();
    if (restore) {
      const selector = restore.slot ? `[data-slot="${restore.slot}"]`
        : `[data-k="${restore.group}"] [data-v="${restore.value}"]`;
      this.root.querySelector(selector)?.focus({ preventScroll: true });
    }
  }

  renderRule() {
    const rule = this.plan.rule;
    const recorded = Number.isFinite(this.lastEntryBar) && this.lastEntryBar > 0;
    const entryBar = recorded ? this.lastEntryBar : 180;
    const exampleBar = Math.round(entryBar);
    const [turnBar, reserveBar] = Rh(entryBar, rule).map(Math.round);
    const legBar = exampleBar - turnBar;
    this.ruleExample.textContent = "Выбери, какую долю газа потратить по пути в пещеру. Остаток нужен для выхода и задержек. " +
      (recorded ? `В прошлый раз у входа было ${exampleBar} бар.` : `Пример для ${exampleBar} бар на входе.`);
    for (const button of this.root.querySelectorAll('[data-k="rule"] button')) {
      const denominator = Number(button.dataset.v);
      button.replaceChildren(
        surveyElement("b", `${exampleBar - Math.round(Rh(entryBar, denominator)[0])} бар`),
        surveyElement("small", `на поиск · 1/${denominator}`),
      );
      button.setAttribute("aria-pressed", String(denominator === rule));
    }
    this.allowance.replaceChildren();
    for (const [name, bar, type] of [
      ["поиск", legBar, "out"], ["выход", turnBar - reserveBar, "home"], ["запас", reserveBar, "spare"],
    ]) {
      const part = surveyElement("span", "", "budget-" + type);
      part.style.flexGrow = String(bar);
      part.append(surveyElement("b", String(bar)), surveyElement("small", name));
      this.allowance.append(part);
    }
    this.root.querySelector('[data-n="rule"]').textContent =
      `Разворот ≈ ${turnBar} бар. Первую отметку на шкале газа прибор поставит по давлению при входе под свод.`;
  }

  renderLoadout() {
    if (!this.equipmentUI) return super.renderLoadout();
    this.root.querySelector('[data-sec="gear"]').classList.remove("hidden");
    this.root.querySelector('[data-sec="bottom"]').classList.add("hidden");
    this.equipmentUI.render();
  }

  // Boat instructions now live directly on the controls. Progress a legacy
  // instructor card only when the player actually uses its corresponding choice.
  showTip(tip, onRead) {
    const controls = {
      planBoat: '[data-a="dive"],[data-a="repeat"],[data-survey-route] button,[data-v],[data-slot]',
      planThirds: '[data-k="rule"] button',
      planTanks: '[data-k="back"] button,[data-slot]',
    };
    this.pendingAdvice = { selector: controls[tip.id], onRead };
  }

  setTips(enabled, seen, total) {
    super.setTips(enabled, seen, total);
    if (!enabled) this.pendingAdvice = null;
  }

  click(event) {
    const button = event.target.closest("button");
    if(button?.dataset.a==="season-reset"){showExpeditionReset();return;}
    if (button?.closest(".equipment-station")) return;
    if (button?.dataset.slot) {
      this.lastSlot = this.plan.slots.includes(button.dataset.slot) ? null : button.dataset.slot;
    }
    const advice = this.pendingAdvice;
    if (advice?.selector && button?.matches(advice.selector)) {
      this.pendingAdvice = null;
      advice.onRead();
    }
    super.click(event);
  }

  setPlan(plan) {
    this.lastSlot = null;
    super.setPlan(plan);
  }

  setSeason(season) {
    this.seasonArmed = 0;
    const album = this.root.querySelector(".survey-album");
    const content = album.querySelector(".season");
    const count = season.found.length;
    album.querySelector("summary").textContent = count
      ? "Альбом · " + count + " " + Gl(count, ["находка", "находки", "находок"])
      : "Альбом экспедиции";
    content.replaceChildren();
    if (count) {
      const frames = ji().frames;
      const gallery = surveyElement("div", "", "dock-album-grid");
      for (const id of season.found) {
        const button = surveyElement("button");
        button.dataset.album = id;
        if (frames[id]) {
          const image = new Image();
          image.src = frames[id];
          image.alt = "";
          button.append(image);
        }
        button.append(surveyElement("span", Eu(id)));
        gallery.append(button);
      }
      content.append(gallery);
    } else content.append(surveyElement("p", "Здесь появятся находки, которые ты привезёшь со съёмки.", "note"));
    if(readDeliveredFilm()){
      const film=surveyElement('button','Привезённая плёнка · выбрать снимки','saved-film-open');
      film.type='button';film.addEventListener('click',()=>openDeliveredFilm(()=>this.setSeason(Bn())));content.append(film);
    }
    const reset = surveyElement("button", "Начать экспедицию заново", "link");
    reset.dataset.a = "season-reset";
    (this.resetSlot ?? content).replaceChildren(reset);
  }

  show() {
    super.show();
    const saved = Me(qt("expedition"));
    const notes = eo().notes;
    this.galleryHelp.open = false;
    this.galleryHelp.hidden = saved?.chapterId !== "survey" || notes.includes("n3") || Bn().found.includes("cache") ||
      !(notes.includes("n2") || saved.observed?.includes("cache"));
    this.root.scrollTop = 0;
  }
}

  showJournal(open) {
    this.journal.hidden = !open;
    this.albumPage.hidden = open;
    this.journalButton.setAttribute("aria-expanded", String(open));
    this.journalButton.textContent = open ? "К плёнке" : "Профиль нырка";
    this.root.scrollTop = 0;
    this.drawProfile();
    (open ? this.journalTitle : this.heading).focus({ preventScroll: true });
  }

  drawProfile() {
    if (!this.state || this.journal.hidden || this.root.classList.contains("hidden")) return;
    const style = getComputedStyle(this.profile);
    const width = this.profile.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    if (width >= 100) Jf(this.chart, this.state, Math.floor(width), Math.max(145, Math.round(width * 0.52)));
  }

  show(state, log, chain = [], dive, notes = []) {
    this.state = state;
    this.evidence.hidden=true;
    this.evidence.replaceChildren();
    this.discovery.hidden=true;this.contact.hidden=false;
    this.msg("");
    this.root.querySelector('[data-n="tm-text"]').classList.add("hidden");
    const lost = state.outcome?.kind === "dead";
    this.shots = lost ? [] : dive.shots ?? [];
    this.scoutingGain = !lost && !this.shots.length ? dive.survey?.routeMarksAdded ?? 0 : 0;
    const target = this.assignment;
    const delivered = !lost && target && dive.finds.includes(target.id);
    const outcome = Au(state, false);
    let title = "Снова на лодке";
    let explanation = "";
    if (lost) {
      title = "Дайвер погиб";
      explanation = outcome.title;
    } else if (state.outcome?.kind === "dcs") {
      title = "Понадобилась помощь";
      explanation = outcome.text;
    } else if (state.outcome?.cesa) {
      title = "Аварийное всплытие";
      explanation = outcome.text;
    } else if (delivered) {
      title = "Задание выполнено";
    } else if (dive.season.newFinds.length) {
      title = "Новые находки на плёнке";
    } else if (this.shots.length) {
      title = "Плёнка на лодке";
    } else if (dive.keptM >= 1) {
      title = "Линия закреплена";
      explanation = "В пещере осталось " + Math.round(dive.keptM) + " м твоей линии. По ней можно вернуться к месту разведки.";
    } else if (this.scoutingGain) {
      title = "Разведан участок старой линии";
    }
    if (!lost && target && !delivered && this.shots.length && !explanation) {
      explanation = "Ориентир «" + target.short + "» ещё предстоит снять.";
    }
    this.heading.textContent = title;
    this.summary.textContent = explanation;
    this.summary.hidden = !explanation;
    const review=surveyReturnReview(state,dive);
    this.returnReview.replaceChildren();this.returnReview.hidden=!review;
    if(review){
      this.returnReview.append(surveyElement('h3',review.title),surveyElement('p',review.text));
      if(review.next)this.returnReview.append(surveyElement('p',review.next,'return-advice'));
    }
    this.renderFrames(dive, lost);
    this.renderGear(dive, lost);
    this.renderRecord(state, log, chain, notes, dive);
    this.next.textContent = this.chapterNote || "";
    this.next.hidden = !this.chapterNote;
    this.root.classList.toggle("dead", lost);
    this.root.classList.remove("hidden");
    this.showJournal(false);
  }

  showEvidence(entries=[],finished=false){
    this.evidence.replaceChildren();this.evidence.hidden=entries.length<2&&!finished;
    if(finished){
      this.evidence.append(surveyElement("small","Последнее свидетельство"),surveyElement("p","Записи и находка у стены теперь на лодке. Можно сопоставить их и подвести итог экспедиции."));
      if(this.state.outcome?.kind==="clean"&&!this.state.outcome?.cesa)this.heading.textContent="Вернулся с ответом";
    }else if(entries.length>1){
      this.evidence.append(surveyElement("h3","Что узнали за этот выход"));
      const list=surveyElement("ul");
      for(const entry of entries.slice(-3)){const item=surveyElement("li");item.append(surveyElement("strong",entry.title),surveyElement("span",entry.source));list.append(item);}
      this.evidence.append(list);
    }
  }

  showDiscovery(debrief){
    this.discovery.replaceChildren(surveyElement('small','Следующий вопрос'),surveyElement('h3',debrief.question));
    this.discovery.hidden=false;
    // Keep a scouting gain below the answer, but hide a bare empty-film message.
    if(debrief.changed&&!this.shots.length&&!this.scoutingGain)this.contact.hidden=true;
    if(debrief.changed&&(this.state.outcome?.kind!=='clean'||this.state.outcome?.cesa))this.discovery.prepend(surveyElement('p',debrief.text));
  }

  renderFrames(dive, lost) {
    this.contact.replaceChildren();
    this.film.replaceChildren();
    this.film.hidden = !this.shots.length;
    this.frameButtons = [];
    if (!this.shots.length) {
      const count = dive.shots?.length ?? 0;
      let text = "Плёнка осталась пустой.";
      if (lost) {
        text = count
          ? "Плёнка потеряна. " + count + " " + Gl(count, ["кадр остался", "кадра остались", "кадров остались"]) + " внизу."
          : "Снимков этого нырка нет.";
      } else if (this.scoutingGain) {
        text = `На карте ещё около ${this.scoutingGain} м знакомой линии. Кружками отмечены границы пройденных участков.`;
      } else if (dive.survey?.kept && dive.survey.added > 0) {
        text += " Разведанный участок появился на карте.";
      }
      this.contact.append(surveyElement("p", text, "result-empty"));
      return;
    }

    this.print = surveyElement("figure", "", "result-print");
    this.preview = surveyElement("button", "", "result-photo");
    this.preview.type = "button";
    this.caption = surveyElement("figcaption", "", "result-print-caption");
    this.fact = surveyElement("p", "", "result-photo-fact");
    this.detail=surveyElement('div','','result-object-detail');
    this.detailArt=surveyElement('figure','','result-detail-art');
    this.detailCanvas=surveyElement('canvas');this.detailCanvas.width=160;this.detailCanvas.height=160;
    this.detailCanvas.setAttribute('role','img');this.detailCanvas.setAttribute('aria-label','Деталь метки: цифры 96 и стёртые знаки под ними');
    this.detailArt.append(this.detailCanvas,surveyElement('figcaption','Деталь метки'));
    this.detail.append(this.detailArt,this.fact);
    this.albumChoices=surveyElement('div','','album-choices');
    this.print.append(this.preview, this.caption, this.detail,this.albumChoices);
    this.contact.append(this.print);

    this.shots.forEach((shot, index) => {
      const item = surveyElement("li");
      const button = surveyElement("button", "", "result-film-frame");
      button.type = "button";
      button.setAttribute("aria-label", "Выбрать кадр " + shot.n +
        (shot.finds.length ? " · " + shot.finds.map(Eu).join(", ") : ""));
      button.addEventListener("click", () => this.selectFrame(index));
      const source = shot.img || shot.big;
      if (source) {
        const image = new Image();
        image.alt = "";
        image.src = source;
        button.append(image);
      } else button.append(surveyElement("span", "Нет изображения", "result-no-image"));
      const label = surveyElement("span", "", "result-film-caption");
      label.append(surveyElement("span", "Кадр " + shot.n, "result-frame-no"));
      for (const id of shot.finds) label.append(surveyElement("span", Eu(id), "result-frame-name"));
      if (!shot.finds.length) label.append(surveyElement("span", surveyShotCaption(shot), "result-frame-name"));
      button.append(label);
      item.append(button);
      this.film.append(item);
      this.frameButtons.push(button);
    });
    this.selectFrame(Math.max(0, this.shots.findIndex(shot => shot.fresh?.length)));
    this.film.scrollLeft = 0;
  }

  selectFrame(index) {
    const shot = this.shots[index];
    if (!shot) return;
    this.selectedFrame = index;
    this.frameButtons.forEach((button, number) => button.setAttribute("aria-pressed", String(number === index)));
    this.preview.dataset.shot = String(index);
    this.preview.setAttribute("aria-label", "Открыть кадр " + shot.n + " крупно");
    const source = shot.big || shot.img;
    this.preview.replaceChildren();
    if (source) {
      const image = new Image();
      image.src = source;
      image.alt = shot.finds.length ? shot.finds.map(Eu).join(", ") : "Подводный снимок";
      this.preview.append(image);
    } else this.preview.append(surveyElement("span", "Изображение не сохранилось", "result-no-image"));
    this.caption.replaceChildren(surveyElement("span", "Кадр " + shot.n + " из " + this.shots.length, "result-print-number"));
    const subjects = surveyElement("span", "", "result-print-subjects");
    for (const id of shot.finds) {
      const name = surveyElement("span", Eu(id));
      if (shot.fresh?.includes(id)) name.append(surveyElement("small", "Впервые"));
      subjects.append(name);
    }
    if (!shot.finds.length) subjects.append(surveyElement("span", surveyShotCaption(shot)));
    this.caption.append(subjects);
    const subject = shot.finds.find(id => shot.fresh?.includes(id)) ?? shot.finds[0];
    this.fact.textContent = subject ? $l(subject)?.fact ?? ""
      : surveyShotExplanation(shot);
    this.fact.hidden = !this.fact.textContent;
    this.detailArt.hidden=subject!=='entry-tag';this.detail.classList.toggle('has-detail',!this.detailArt.hidden);
    if(!this.detailArt.hidden){
      // A clearly labelled object illustration, using the same asset as the
      // cave. The photograph above remains the actual captured frame.
      const ctx=this.detailCanvas.getContext('2d'),find=$l(subject);ctx.clearRect(0,0,160,160);
      drawSurveyArtifact(ctx,{ox:find.x-.65,oy:find.y-.75,zoom:120},null,find);
    }
    renderAlbumChoice(this.albumChoices,shot,this.deliveredFilm,()=>this.onAlbumChange?.());
  }

  renderGear(dive, lost) {
    const lines = dive.gear ?? [];
    const rewards = dive.gearIds?.length
      ? [...new Set(dive.gearIds)].filter(id => id !== "single12")
        .map(id => ({ id, line: Zi.find(gear => gear.id === id)?.line }))
      : lines.map(line => ({ id: Zi.find(gear => gear.line === line)?.id, line }));
    this.gear.replaceChildren();
    this.gear.hidden = lost || !rewards.length;
    if (this.gear.hidden) return;
    this.gear.append(surveyElement("h3", "На лодке приготовили"));
    for (const { id, line } of rewards) {
      const guide = surveyGearGuidance[id];
      if (guide) this.gear.append(surveyElement("h4", guide.label), surveyElement("p", guide.when));
      else if (line) this.gear.append(surveyElement("p", line));
    }
  }

  renderRecord(state, log, chain, notes, dive) {
    this.journalTitle.textContent = "Нырок №" + log.n;
    this.record.replaceChildren();
    if (chain.length) this.record.append(surveyElement("p", chain.join(" → "), "result-cause"));
    for (const note of notes) this.record.append(surveyElement("p", note));
    if (this.shotBar != null && state.outcome?.kind !== "dead") {
      const surface = Math.round(state.tanks.find(tank => tank.id === "back").bar);
      this.record.append(surveyElement("p", "При съёмке цели было " + this.shotBar + " бар. На поверхности — " + surface + " бар."));
    }
    const mapped = Math.round((dive.survey?.added ?? 0) * Ne.CELL_M * Ne.CELL_M);
    if (dive.survey?.kept && mapped > 0) this.record.append(surveyElement("p", "На карте +" + mapped + " м² разведанного."));
    const readings = surveyElement("ul", "", "result-log-entry");
    for (const field of log.line.split(" · ")) readings.append(surveyElement("li", field));
    this.record.append(readings);
    const turningTank = dive.turn?.state === "ok" && dive.turn.tanks.find(tank => tank.id === "back");
    this.turn.hidden = !turningTank;
    if (turningTank) {
      const bar = turningTank.bar.toLocaleString("ru-RU", { maximumFractionDigits: 1 });
      const mark = turningTank.mark.toLocaleString("ru-RU", { maximumFractionDigits: 1 });
      this.turn.textContent = "Разворот при " + bar + " бар. Отметка по плану — " + mark + " бар.";
    }
    this.chart.setAttribute("aria-label", "Профиль глубины за " + me(state.t) +
      ". Максимум " + state.maxDepth.toFixed(1).replace(".", ",") + " м.");
    this.legend.replaceChildren();
    for (const tank of state.tanks) {
      const item = surveyElement("span", tank.id === "deco" ? "EAN50" : Yt[tank.id].label);
      const swatch = surveyElement("i");
      swatch.style.background = Ja[tank.id];
      item.prepend(swatch);
      this.legend.append(item);
    }
    if (state.stats.decoT > 0) this.legend.append(surveyElement("span", "┄ Потолок декомпрессии"));
    if (state.log.some(event => event.type === "gas")) this.legend.append(surveyElement("span", "◆ Смена газа"));
    if (state.log.some(event => ["pickup", "drop", "clip"].includes(event.type))) this.legend.append(surveyElement("span", "◇ Баллон"));
    if (state.log.some(event => event.type === "alarm")) this.legend.append(surveyElement("span", "▼ Тревога"));
    if (state.fail.list.some(failure => failure.warnT >= 0)) this.legend.append(surveyElement("span", "П — подача · Ф — фонарь · Л — линия"));
  }
}

// A small software-rendered scene, sharing Canvas 2D with the underwater game.
// World units and camera poses live here; the interface only names a station.
// A chapter can override `surface` without changing menus or dive simulation.
const expeditionSurface = { setting: "boat", light: "day" };

class SurfaceScene extends ExpeditionBoatModel {
  constructor(canvas, onAnchors) {
    super();
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", {alpha:false});
    this.onAnchors = onAnchors;
    this.environment = {...expeditionSurface};
    this.pointer = {x:0,y:0};
    this.camera = {x:0,y:3.25,z:-2.7,tx:0,ty:1.1,tz:3.2};
    this.target = {...this.camera};

    this.running = false;
    this.reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const grain = document.createElement("canvas");
    grain.width = grain.height = 96;
    const grainContext = grain.getContext("2d");
    const pixels = grainContext.createImageData(96,96);
    let seed = 19811996;
    for (let i=0;i<pixels.data.length;i+=4) {
      seed = (Math.imul(seed,1664525)+1013904223)>>>0;
      const v=80+(seed%100);
      pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=v;

  setEnvironment(environment = expeditionSurface) {

  setView(screen, station) {
    const poses = {
      menu:{x:-.48,y:3.1,z:-2.6,tx:0,ty:1.2,tz:3.5},
      boat:{x:0,y:3.25,z:-2.7,tx:0,ty:1.1,tz:3.2},
      map:{x:0,y:3,z:-.25,tx:0,ty:1.05,tz:2.8},
      gear:{x:1.2,y:2.65,z:-.65,tx:1.5,ty:1.6,tz:3.5},
      album:{x:-1.1,y:2.6,z:-.3,tx:-1.35,ty:1.15,tz:2.65},
      plunge:{x:-2.4,y:2.2,z:-1.1,tx:-3.1,ty:-.5,tz:1.1},
    };
    const key = screen === "station" ? station : screen === "chapters" ? "map" : screen === "result" || screen === "ending" ? "album" : screen;
    this.target = {...(poses[key] ?? poses.boat)};

  }

  resize() {
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.dpr = Math.min(2,window.devicePixelRatio || 1);
    this.canvas.width = Math.round(this.w*this.dpr);
    this.canvas.height = Math.round(this.h*this.dpr);
    this.canvas.style.width = this.w+"px";
    this.canvas.style.height = this.h+"px";

  }

  start() {
    if (this.running) return;
    this.running = true;
    this.last = 0;
    const frame = now => {
      if (!this.running) return;
      const elapsed = this.last ? now-this.last : 34;
      if (!document.hidden && elapsed >= 1000/30-1) {

        for (const key of Object.keys(this.camera)) this.camera[key] += (this.target[key]-this.camera[key])*(1-Math.exp(-dt*5));

  basis() {
    const c = this.camera, bob = this.environment.setting === "boat" ? Math.sin(this.time*.66)*.025 : 0;

    this.eye = [c.x+this.pointer.x*parallax,c.y+bob+this.pointer.y*parallax+(closeView ? .45 : 0),c.z+(closeView ? .75 : 0)];
    const normal = v => {const n=Math.hypot(...v);return v.map(k=>k/n);};
    const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
    this.forward = normal([c.tx-this.eye[0],c.ty-this.eye[1],c.tz-this.eye[2]]);
    this.right = normal(cross([0,1,0],this.forward));
    this.up = cross(this.forward,this.right);
    // Portrait keeps all three stations in frame instead of cropping the scene.

  project(point) {
    const d=point.map((value,index)=>value-this.eye[index]);
    const dot=v=>d[0]*v[0]+d[1]*v[1]+d[2]*v[2];
    const z=dot(this.forward);
    return {x:this.w*.5+dot(this.right)/z*this.focal,y:this.h*.48-dot(this.up)/z*this.focal,z};
  }

  makeMaterialNoise() {
    const tile=document.createElement("canvas");tile.width=tile.height=128;
    const ctx=tile.getContext("2d"),data=ctx.createImageData(128,128);

      const i=(y*128+x)*4;

      data.data[i]=data.data[i+1]=data.data[i+2]=v;data.data[i+3]=62;

  tableDetail() {
    const ctx=this.ctx;
    // Fine scratches and grain remain anchored to the tabletop as it moves.
    ctx.save();
    for(let i=0;i<110;i++){
      const x=-2+dt(i,1,9)*4,z=1.25+dt(i,2,9)*2.55;
      this.screenPath([[x,1.138,z],[x+.04+dt(i,3,9)*.16,1.138,z+.005]]);
      ctx.strokeStyle=i%3?"#dae3df21":"#29434a18";ctx.lineWidth=.7;ctx.stroke();
    }

    for(const [x,z,rx,rz] of [[-1.45,2.47,.52,.7],[1.45,3.05,.4,.38],[1.38,2.15,.26,.45]]){
      for(let n=7;n>=0;n--){
        this.screenPath(Array.from({length:30},(_,i)=>[x+Math.cos(i/30*Math.PI*2)*(rx+n*.012),1.139,z+Math.sin(i/30*Math.PI*2)*(rz+n*.012)]),true);
        ctx.fillStyle="#142b3508";ctx.fill();

  }

  screenPath(points,close=false) {
    const ctx=this.ctx;
    ctx.beginPath();
    points.forEach((p,i)=>{const s=this.project(p);if(i)ctx.lineTo(s.x,s.y);else ctx.moveTo(s.x,s.y);});
    if(close)ctx.closePath();
  }

  drawMap() {
    const ctx=this.ctx;
    ctx.save();
    for(let x=-.7;x<.85;x+=.18){this.screenPath([[x,1.144,1.84],[x-.04,1.144,3.49]]);ctx.strokeStyle="#aaa88644";ctx.lineWidth=.65;ctx.stroke();}
    for(let z=1.9;z<3.5;z+=.18){this.screenPath([[-.72,1.144,z],[.77,1.144,z]]);ctx.strokeStyle="#aaa88644";ctx.stroke();}
    const traces=[[[.02,1.98],[-.17,2.25],[-.06,2.6],[-.2,3.4]],[[.17,2],[.03,2.3],[.15,2.63],[.04,3.4]],[[.1,2.35],[.64,2.38],[.69,2.61],[.14,2.68]],[[.05,2.95],[.62,3],[.64,3.2],[0,3.24]]];
    for(const line of traces){this.screenPath(line.map(([x,z])=>[x,1.146,z]));ctx.strokeStyle="#586b60";ctx.lineWidth=1.2;ctx.stroke();}
    this.screenPath([[.07,1.148,2.1],[.06,1.148,2.52],[.58,1.148,2.52]]);ctx.strokeStyle="#a77d51";ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();
    ctx.restore();
  }

  coastTexture() {
    if(this.terrain)return this.terrain;
    const canvas=document.createElement("canvas");
    canvas.width=this.w;canvas.height=Math.round(Math.max(70,Math.min(135,this.h*.19)));
    const ctx=canvas.getContext("2d"),image=ctx.createImageData(canvas.width,canvas.height);
    const base=dn(I.rock),light=dn(I.rockLight),edge=dn(I.edge),sky=dn(I.sky[1]);
    for(let x=0;x<canvas.width;x++){
      const u=x/canvas.width;
      const top=canvas.height*(.52+Math.sin(u*9+.8)*.12+Math.sin(u*21)*.055)+(Jn(x*.025,2,9)-.5)*9;
      for(let y=Math.max(0,Math.floor(top));y<canvas.height;y++){
        const d=y-top,n=Jn(x*.055,y*.065,9),fine=dt(x,y,11)-.5;
        const stratum=.5+.5*Math.sin(y*.17+Jn(x*.017,y*.02,7)*5);
        const mix=.25+n*.65+stratum*.15;
        const i=(y*canvas.width+x)*4;
        for(let c=0;c<3;c++){
          let v=base[c]+(light[c]-base[c])*mix+fine*13;
          if(d<2.5)v+=(edge[c]-v)*(1-d/3)*.7;
          image.data[i+c]=v*.58+sky[c]*.42;
        }
        image.data[i+3]=255;

  }

  drawEnvironment() {
    const ctx=this.ctx,w=this.w,h=this.h,t=this.time,night=this.environment.light==="night",ice=this.environment.setting==="ice";
    const horizon=h*(.29+(this.camera.ty-1.1)*.022);
    const sky=ctx.createLinearGradient(0,0,0,horizon+40);
    sky.addColorStop(0,night?"#071322":I.sky[0]);sky.addColorStop(1,night?"#203a47":I.sky[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
    if(night){ctx.fillStyle="#d3e1d17a";for(let i=0;i<42;i++){const x=((i*137.49)%997)/997*w,y=((i*71.31)%271)/271*horizon*.8;ctx.fillRect(x,y,i%6===0?2:1,1);}ctx.fillStyle="#d4dfcd";ctx.beginPath();ctx.arc(w*.79,horizon*.33,9,0,Math.PI*2);ctx.fill();}
    const coast=this.coastTexture();
    ctx.save();ctx.globalAlpha=night?.16:.8;ctx.drawImage(coast,0,horizon+8-coast.height);ctx.restore();

    sea.addColorStop(0,night?"#163841":ice?"#889f9e":I.water[0][1]);sea.addColorStop(.45,night?"#0b2e38":ice?"#bcc9bc":I.water[1][1]);sea.addColorStop(1,night?"#061c29":ice?"#68888c":I.water[4][1]);ctx.fillStyle=sea;ctx.fillRect(0,horizon+4,w,h);
    if(!night){
      const haze=ctx.createLinearGradient(0,horizon-35,0,horizon+70);
      haze.addColorStop(0,"#eafaff00");haze.addColorStop(.32,"#eafaff65");haze.addColorStop(1,"#eafaff00");ctx.fillStyle=haze;ctx.fillRect(0,horizon-35,w,105);
    }
    if(ice){
      ctx.strokeStyle="#dce5d255";ctx.lineWidth=1;
      for(let i=0;i<16;i++){let y=horizon+(i/16)**1.4*(h-horizon);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w*.3,y+15);ctx.lineTo(w*.6,y-5);ctx.lineTo(w,y+20);ctx.stroke();}
      ctx.fillStyle="#123943";ctx.beginPath();ctx.ellipse(w*.15,h*.76,w*.2,h*.11,-.12,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d5e5d5";ctx.lineWidth=8;ctx.stroke();
    }else{
      for(let row=0;row<65;row++) {
        const v=row/65,y=horizon+8+v*v*(h-horizon),len=8+v*75;
        ctx.strokeStyle=night?`rgba(122,178,178,${.02+v*.08})`:`rgba(222,250,255,${.09+v*.19})`;
        ctx.lineWidth=.6+v*1.2;
        for(let j=0;j<11;j++){const x=(j/10*w+Math.sin(row*2.1+j*3.7+t*.26)*35+t*2*(row%2?1:-1))%(w+len);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+len*.55,y-Math.sin(t+row)*2,x+len,y);ctx.stroke();}
      }
      ctx.save();ctx.globalCompositeOperation="lighter";
      for(let i=0;i<100;i++){
        const u=dt(i,2,91),v=dt(i,3,91),x=u*w,y=horizon+12+v*v*(h-horizon);
        const pulse=Math.max(0,Math.sin(t*(1.3+v*2.5)+u*20));
        if(pulse<.4)continue;
        const length=1.5+v*8;
        ctx.strokeStyle=`rgba(236,252,255,${pulse*(night?.08:.6)})`;ctx.lineWidth=.7+v;
        ctx.beginPath();ctx.moveTo(x-length,y);ctx.lineTo(x+length,y);ctx.stroke();

  paintFace(face) {
    const ctx=this.ctx,points=face.projected;

    const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
    const a=points[0],b=points[face.smooth?.edge??1];

    light.addColorStop(0,face.smooth ? face.color : this.tint(face.color,1.13));
    if(!face.smooth)light.addColorStop(.36,face.color);
    light.addColorStop(1,face.smooth?.to??this.tint(face.color,.83));
    ctx.fillStyle=light;ctx.fill();
    ctx.strokeStyle=face.smooth ? light : face.stroke??face.color;ctx.lineWidth=.45;ctx.stroke();

  }

  objectAreas() {
    const bounds = {
      map:[[-.83,1.15,1.75],[.91,1.15,1.75],[-.83,1.15,3.65],[.91,1.15,3.65]],
      album:[[-1.9,1.25,1.85],[-1,1.25,1.85],[-1.9,1.25,3.1],[-1,1.25,3.1]],
      gear:[[1.0,.95,4.05],[2.18,.95,4.05],[1,2.45,4.05],[2.18,2.45,4.05]],
    };
    return Object.fromEntries(Object.entries(bounds).map(([id,points])=>{
      const projected=points.map(p=>this.project(p));
      const x0=Math.min(...projected.map(p=>p.x)),x1=Math.max(...projected.map(p=>p.x));
      const y0=Math.min(...projected.map(p=>p.y)),y1=Math.max(...projected.map(p=>p.y));
      return [id,{x:(x0+x1)/2,y:(y0+y1)/2,width:Math.max(44,x1-x0),height:Math.max(44,y1-y0)}];
    }));
  }

  draw() {
    const ctx=this.ctx,w=this.w,h=this.h;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.basis();
    this.drawEnvironment();
    const sorted=this.mesh.map(face=>({...face, projected:face.points.map(point=>this.project(point))}));
    sorted.sort((a,b)=>a.layer-b.layer || b.projected.reduce((s,p)=>s+p.z,0)/b.points.length-a.projected.reduce((s,p)=>s+p.z,0)/a.points.length);

      ctx.beginPath();face.projected.forEach((point,i)=>i?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));

      else {ctx.closePath();this.paintFace(face);}
    }
    if(this.environment.light!=="night") {
      // The same cool daylight and warm lens glow seen at the waterline.
      ctx.save();ctx.globalCompositeOperation="lighter";
      const sun=ctx.createRadialGradient(w*.76,-h*.04,3,w*.76,-h*.04,h*.85);
      sun.addColorStop(0,"#fff6d936");sun.addColorStop(.55,"#d0f5ff0d");sun.addColorStop(1,"#d0f5ff00");
      ctx.fillStyle=sun;ctx.fillRect(0,0,w,h);ctx.restore();
    }
    if(this.environment.light==="night") {
      ctx.fillStyle="#061e3d80";ctx.fillRect(0,0,w,h);
      const lamp=this.project([-2.12,.4,4.35]);
      const glow=ctx.createRadialGradient(lamp.x,lamp.y,3,lamp.x,lamp.y,Math.max(w,h)*.45);
      glow.addColorStop(0,"#e8e0a83d");glow.addColorStop(.3,"#c2d1a817");glow.addColorStop(1,"#b8c5a000");ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
    }
    ctx.save();ctx.globalCompositeOperation="soft-light";ctx.fillStyle=this.grain;ctx.fillRect(0,0,w,h);ctx.restore();
    const shade=ctx.createRadialGradient(w*.52,h*.49,h*.2,w*.5,h*.45,Math.max(w,h)*.78);
    shade.addColorStop(0,"#011a1b00");shade.addColorStop(1,"#01152270");ctx.fillStyle=shade;ctx.fillRect(0,0,w,h);
    if(this.screen==="boat")this.onAnchors?.(this.objectAreas());
  }
}

// This layer lives outside the boat and the game frame, so it survives the
// change of scene. Simulation and input remain held until the reveal is over.
class DiveTransition {
  constructor(game, boat) {
    this.game = game;
    this.boat = boat;
    this.active = false;
    this.timers = new Set();
    this.root = surveyElement("div", "", "dive-transition");
    this.root.hidden = true;
    this.root.setAttribute("aria-hidden", "true");
    this.root.innerHTML = '<div class="dive-transition-veil"></div><div class="dive-transition-water">' +
      Array.from({length: 9}, (_, i) => '<i style="--bubble:' + i + '"></i>').join("") + '</div>';
    document.body.append(this.root);
    window.addEventListener("pagehide", () => this.cancel());
  }

  after(delay, callback) {
    const timer = setTimeout(() => {
      this.timers.delete(timer);
      if (this.active) callback();
    }, delay);
    this.timers.add(timer);
  }

  begin(plan) {
    if (this.active) return false;
    // begin() is called synchronously by the player's click, before any timer.
    this.game.sound.init();
    this.active = true;
    this.started = false;
    this.previousPaused = this.game.paused;
    this.game.paused = true;
    this.game.input.enabled = false;
    this.game.input.reset();
    this.game.frameEl.inert = true;
    this.boat.root.inert = true;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fadeOut = reduced ? 120 : 480;
    const hold = reduced ? 70 : 180;
    const fadeIn = reduced ? 160 : 760;
    this.root.classList.toggle("reduced-motion", reduced);
    this.root.style.setProperty("--dive-fade-out", fadeOut + "ms");
    this.root.style.setProperty("--dive-fade-in", fadeIn + "ms");
    this.root.dataset.phase = "ready";
    this.root.hidden = false;
    // Commit the clear starting state before beginning the fade.
    this.root.getBoundingClientRect();
    this.root.dataset.phase = "closing";
    this.after(fadeOut + 32, () => {
      this.root.dataset.phase = "submerged";
      try {
        this.game.startDive(plan);
        this.holdDive();
        this.stopSound = this.game.sound.plunge?.();
      } catch (error) {
        this.cancel();
        throw error;
      }
      this.after(hold, () => {
        this.root.dataset.phase = "opening";
        this.after(fadeIn + 32, () => this.finish());
      });
    });
    return true;
  }

  holdDive() {
    if (!this.active) return;
    this.started = true;
    this.game.paused = true;
    this.game.clock.acc = 0;
    this.game.input.enabled = false;
    this.game.input.reset();
    this.game.frameEl.inert = true;
  }

  finish() {
    if (!this.active) return;
    this.cancel();
    if(document.hidden)this.game.pauseUI?.show("Игра приостановлена при сворачивании.");
  }

  cancel() {
    for (const timer of this.timers) clearTimeout(timer);
    this.timers.clear();
    this.stopSound?.();
    this.stopSound = null;
    this.root.hidden = true;
    this.root.dataset.phase = "ready";
    if (!this.active) return;
    this.active = false;
    this.boat.busy = false;
    this.boat.root.inert = false;
    this.game.paused = this.started ? false : this.previousPaused;
    this.game.clock.acc = 0;
    this.game.input.reset();
    this.game.input.enabled = this.game.mode === "dive" && this.boat.root.hidden;
    this.game.frameEl.inert = !this.boat.root.hidden;
    this.started = false;
  }
}

class SurveyEnding {
  constructor(boat){

    this.root.setAttribute('aria-label','Итог экспедиции');boat.root.append(this.root);

    this.root.append(surveyElement("p","Ты кладёшь снимки на стол. Напарник разворачивает старую схему.","ending-scene"));
    const strip=surveyElement("div","","ending-photos"),album=ji().frames;
    for(const [id,label] of [["slate81","Записи · август 1981"],["body","Место у стены"]]){
