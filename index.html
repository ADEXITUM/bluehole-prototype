const lastExpeditionKey = 'bluehole-photo-survey:last-expedition';
const iceProgressKey = 'bluehole-photo-survey:ice:progress';

class SurveyExpeditions {
  constructor(boat) {
    this.boat = boat;
    this.root = surveyElement('section', '', 'exp-library exp-paper');
    this.root.hidden = true;
    this.root.setAttribute('aria-label', 'Экспедиции');
    this.iceHost = surveyElement('section');
    this.iceHost.id = 'ice-expedition';
    this.iceHost.hidden = true;
    this.saveNotice = surveyElement('p', '', 'ice-save-notice');
    this.saveNotice.hidden = true;
    this.saveNotice.setAttribute('role', 'status');
    boat.root.append(this.root, this.iceHost);
  }

  get lastWasIce() {
    return Me(lastExpeditionKey) === 'ice';
  }

  open(id) {
    if (id === 'ice') {
      this.openIce();
      return;
    }
    de(lastExpeditionKey, 'hub');
    const {game} = this.boat;
    if (game.session?.available(game.world)) this.boat.resumeDive();
    else this.boat.enterChapter();
  }

  openIce() {
    if (this.ice) return;
    const boat = this.boat;
    const progress = this.transientIce ?? Me(iceProgressKey) ?? {};
    let revision = progress.revision ?? 0;
    let saveError = false;
    boat.game.mode = 'plan';
    boat.setScreen('ice');
    boat.surface.stop();
    de(lastExpeditionKey, 'ice');
    this.iceHost.append(this.saveNotice);

    const onSave = snapshot => {
      if (saveError) return false;
      try {
        const stored = Me(iceProgressKey);
        if ((stored?.revision ?? 0) !== revision) throw new Error('conflict');
        const next = {...snapshot, completed: !!(stored?.completed || snapshot.completed), revision: revision + 1};
        try {
          localStorage.setItem(iceProgressKey, JSON.stringify(next));
        } catch {
          this.transientIce = {...next, revision};
          this.saveNotice.textContent = 'Выход сохранён в этой вкладке. Запись на устройство будет повторена.';
          this.saveNotice.hidden = false;
          return false;
        }
        revision = next.revision;
        this.transientIce = null;
        this.saveNotice.hidden = true;
        return true;
      } catch (error) {
        saveError = true;
        this.transientIce = null;
        this.saveNotice.hidden = true;
        // Leave the last successful checkpoint intact. Destroy after the current
        // game handler finishes so its final render cannot cover the error.
        queueMicrotask(() => {
          this.show();
          const message = error.message === 'conflict'
            ? 'Другая вкладка обновила подлёдную экспедицию. Открой её снова, чтобы продолжить сохранённый выход.'
            : 'Не удалось сохранить подлёдный выход. Последнее успешное сохранение можно продолжить из экспедиций.';
          const alert = surveyElement('p', message);
          alert.setAttribute('role', 'alert');
          this.root.prepend(alert);
        });
        return false;
      }
    };
    this.ice = new IceDive({host: this.iceHost, progress, onSave, onExit: () => this.show()});
    this.ice.start();
  }

  show() {
    if (this.ice) {
      this.ice.destroy();
      this.ice = null;
      this.iceHost.replaceChildren();
    }
    this.boat.game.mode = 'plan';
    this.boat.setScreen('expeditions');
    this.root.replaceChildren();
    const header = surveyElement('header', '', 'station-header');
    const title = surveyElement('h2', 'Экспедиции');
    title.tabIndex = -1;
    const back = surveyElement('button', '×');
    back.setAttribute('aria-label', 'В главное меню');
    back.addEventListener('click', () => this.boat.showMenu());
    header.append(title, back);
    this.root.append(header);
    const hub = this.boat.progress;
    const season = Bn();
    const checkpoint = this.boat.game.session?.available(this.boat.game.world);
    const hubStarted = checkpoint || season.dives > 0 || hub.hasSeenIntro();
    const hubStatus = checkpoint ? 'Сохранён нырок под водой'
      : hub.isFinished ? 'Установлен последний маршрут пропавшего дайвера'
      : hubStarted ? hub.intention(hub.nextPlan().id).title : 'Первая разведка у буя';
    const record = Me(qt('field-record')) ?? hub.journal().slice(1).at(-1);
    this.addCard('hub', 'Блю-хол', 'Старая линия уходит под камень. Выясни, куда она вела.', hubStatus, hubStarted, record?.text);
    const ice = this.transientIce ?? Me(iceProgressKey);
    this.addCard('ice', 'Подо льдом', 'Под ледяной крышей обратно на поверхность ведёт одна майна.', this.iceStatus(ice), !!ice, ice?.fieldRecord);
    if (this.transientIce) this.root.append(this.saveNotice);
    title.focus({preventScroll: true});
  }

  iceStatus(ice) {
    if (['diving', 'paused'].includes(ice?.dive?.phase)) return 'Сохранён нырок подо льдом';
    if (ice?.dive?.phase === 'lost') return 'У майны · подготовиться к повторному выходу';
    if (ice?.completed && ice.westRecovered) return 'Обе записи в архиве полярного поста';
    if (ice?.westRecovered) return 'Гидрофон доставлен · на востоке остался самописец';
    if (ice?.completed) return 'Работа на востоке завершена · на западе доступен гидрофон';
    if (ice?.charted) return 'Пеленг доставлен · доступна катушка';
    return 'Первый выход под лёд';
  }

  addCard(id, name, premise, status, started, fieldRecord) {
    const card = surveyElement('article', '', 'expedition-card');
    card.dataset.place = id;
    const art = surveyElement('div', '', 'expedition-map-art');
    art.dataset.place = id;
    art.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 3; i++) art.append(surveyElement('i'));
    const enter = surveyElement('button', started ? 'Продолжить' : 'Начать', 'exp-primary');
    enter.dataset.enter = id;
    enter.setAttribute('aria-label', enter.textContent + ' · ' + name);
    enter.addEventListener('click', () => this.open(id));
    card.append(art, surveyElement('h3', name), surveyElement('p', premise));
    if (typeof fieldRecord === 'string' && fieldRecord) {
      card.append(surveyElement('p', fieldRecord, 'library-record'));
    }
    card.append(surveyElement('p', status, 'library-status'), enter);
    this.root.append(card);
  }
}

class SurveyPause {
  constructor(game){
    this.game=game;this.open=false;
    this.button=surveyElement('button','Ⅱ','dive-pause-button');this.button.setAttribute('aria-label','Пауза');this.button.hidden=true;
    this.button.addEventListener('click',()=>this.show());game.frameEl.append(this.button);
    this.dialog=surveyElement('dialog','','dive-pause-dialog');this.dialog.setAttribute('aria-label','Пауза погружения');document.body.append(this.dialog);
    this.dialog.addEventListener('cancel',event=>{event.preventDefault();this.resume();});
    window.addEventListener('keydown',event=>{
      if(event.repeat||game.mode!=='dive'||game.boat?.transition?.active)return;
      if((event.key==='Escape'&&!game.noteOpen&&!game.gas.open)||event.code==='KeyP'){
        event.preventDefault();event.stopImmediatePropagation();this.open?this.resume():this.show();
      }
    },true);
    window.addEventListener('blur',()=>this.show('Игра приостановлена при переключении окна.'));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.show('Игра приостановлена при сворачивании.');});
  }
  update(){this.button.hidden=this.game.mode!=='dive'||!!this.game.noteOpen||this.game.boat?.transition?.active||this.open;}
  show(reason=''){
    const g=this.game;if(this.open||g.mode!=='dive'||g.boat?.transition?.active)return;
    this.open=true;g.paused=true;g.clock.acc=0;g.input.enabled=false;g.input.reset();g.frameEl.inert=true;this.update();
    const saved=g.session?.save(g,true);
    if(g.session?.blocked)return;
    this.dialog.replaceChildren();
    const title=surveyElement('h2','На паузе');title.tabIndex=-1;
    this.dialog.append(surveyElement('p','Блю-хол · погружение','exp-eyebrow'),title,surveyElement('p',reason||'Глубина, газ и время остановлены.'));
    const resume=surveyElement('button','Продолжить погружение','exp-primary');resume.addEventListener('click',()=>this.resume());this.dialog.append(resume);
    if(g.session){
      const status=surveyElement('p',saved?'Нырок сохранён. Можно закрыть вкладку.':'Не удалось сохранить этот момент. После закрытия вкладки часть выхода может потеряться.','pause-save-status');status.setAttribute('role','status');
      this.dialog.append(status);
      if(!saved){const retry=surveyElement('button','Повторить сохранение');retry.addEventListener('click',()=>{if(g.session.save(g,true)){status.textContent='Нырок сохранён. Можно закрыть вкладку.';retry.hidden=true;}});this.dialog.append(retry);}
    }
    const help=surveyElement('section');new SurveyHelp(help);this.dialog.append(help);
    const abandon=surveyElement('button','Вернуться к подготовке','pause-abandon');abandon.addEventListener('click',()=>this.confirmAbandon());this.dialog.append(abandon);
    this.dialog.showModal();title.focus();
  }
  confirmAbandon(){
    this.dialog.replaceChildren(surveyElement('h2','Прервать этот нырок?'),surveyElement('p','Кадры, записи и линия этого выхода не будут доставлены. Прежний альбом и подготовка на лодке сохранятся.'));
    const stay=surveyElement('button','Остаться под водой','exp-primary');stay.addEventListener('click',()=>this.resume());
    const leave=surveyElement('button','Прервать и вернуться');leave.addEventListener('click',()=>{
      if(!this.game.session.finish()){this.dialog.append(surveyElement('p','Не удалось записать прерывание. Нырок оставлен на паузе.'));return;}
      this.game.tm?.abandon();this.resume();this.game.showPlan();
    });
    this.dialog.append(stay,leave);stay.focus();
  }
  resume(){
    if(!this.open||this.locked)return;this.open=false;this.dialog.close();const g=this.game;
    g.paused=false;g.clock.acc=0;g.last=performance.now();g.input.reset();g.input.enabled=g.mode==='dive';g.frameEl.inert=false;this.update();
  }
  conflict(){
    this.open=true;this.locked=true;
    const g=this.game;g.paused=true;g.mode='suspended';g.clock.acc=0;g.input.enabled=false;g.input.reset();g.frameEl.inert=true;
    this.dialog.replaceChildren(surveyElement('h2','Нырок открыт в другой вкладке'),surveyElement('p','Эта вкладка остановлена, чтобы не перезаписать более новое сохранение.'));
    const reload=surveyElement('button','Открыть актуальное меню','exp-primary');reload.addEventListener('click',()=>window.location.reload());this.dialog.append(reload);
    if(!this.dialog.open)this.dialog.showModal();reload.focus();this.update();
  }
}

    });

      const button = event.target.closest("[data-boat]");
      if (button && !button.disabled) this.act(button.dataset.boat);
    });

      if (this.screen === "station" && this.stationEl.dataset.station === "gear" && this.game.planScreen.equipmentUI?.closeInfo()) return;
      if (this.screen === "briefing") this.showBoat();
      else if (this.screen === "station" || this.screen === "chapters") this.close();

      else if (this.screen === "boat") this.showMenu();
    }, true);

    this.preflight?.cancelTimer();

    this.root.dataset.light = this.progress.activeChapter.surface?.light ?? "day";
    this.game.frameEl.inert = true;
    this.game.input.enabled = false;
    this.game.input.reset();
    for (const [key, element] of Object.entries({menu: this.menuEl, boat: this.homeEl,
      chapters: this.chaptersEl, story: this.storyEl, station: this.stationEl, briefing:this.preflight?.root, ending:this.ending?.root, expeditions:this.library?.root, ice:this.library?.iceHost})) if(element)element.hidden = key !== name;
    this.game.planScreen.hide();
    this.game.resultScreen.hide();
    this.root.scrollTop = 0;
    this.surface?.setEnvironment(this.progress.activeChapter.surface);
    this.surface?.setView(name);

  act(action) {
    if (this.busy) return;
    if (this.screen === "boat" && ["map","gear","album"].includes(action)) {
      this.surfaceHintSeen = true;
      de(qt("boat-objects-seen"),true);
    }
    if (action === "continue") this.library.open(this.library.lastWasIce ? "ice" : "hub");
    else if(action==='abandon-dive')this.abandonSavedDive();
    else if (action === "menu") this.showMenu();
    else if (action === "chapters") this.showChapters();
    else if (action === "expeditions") this.showExpeditions();
    else if (action === "close") this.close();
    else if (action === "dive") this.dive();
    else if (action === "story-next") this.nextStory();
    else if (action === "story-skip") this.endStory();
    else if (action === "next") {
      const next = expeditionChapters.find(chapter => this.progress.canEnter(chapter.id) && !this.progress.isComplete(chapter.id));
      if (next && this.progress.select(next.id)) { this.game.updateAssignment(); this.enterChapter(); }
    } else this.openStation(action);
  }

  showMenu() {
    this.setScreen("menu");
    this.root.querySelector(".exp-premise").textContent = this.library?.lastWasIce
      ? "Подо льдом остались приборы зимнего акустического поста."
      : "Старая линия уходит под камень. Узнай, куда она ведёт. Вернись и расскажи.";
    const hasProgress = Bn().dives > 0 || this.progress.hasSeenIntro();
    this.root.querySelector('[data-boat="continue"]').textContent = hasProgress ? "Продолжить экспедицию · Блю-хол" : "Начать Блю-хол";
    const chapter = this.progress.activeChapter;
    const place=this.game.firstDive?.active?"У спуска":chapter.title;
    this.root.querySelector(".exp-resume").textContent = hasProgress ? `Блю-хол · ${place}` : "Исследование пещеры · фотографии · путь обратно";
    if(this.game.session?.interrupted)this.root.querySelector(".exp-resume").textContent="Последний нырок прерван. Продолжение — с подготовки на лодке. Прежние находки сохранены; недоставленные кадры и линия не засчитаны.";
    else if(this.progress.isFinished)this.root.querySelector(".exp-resume").textContent="История завершена · альбом и свободное исследование";
    const pending=this.game.session?.available(this.game.world);
    this.root.querySelector('[data-boat="abandon-dive"]').hidden=!pending;
    if(pending){
      const finished=this.game.session.saved.snapshot.state.phase==='end';
      this.root.querySelector('[data-boat="continue"]').textContent=finished?'Открыть итог нырка':'Продолжить погружение';
      this.root.querySelector('[data-boat="abandon-dive"]').hidden=finished;
      this.root.querySelector('.exp-resume').textContent=finished?'Нырок завершён. Осталось открыть итог.':'Сохранённый нырок. Продолжение откроется на паузе; газ и время не изменятся.';
    }else if(this.game.session?.saved?.snapshot&&this.game.session.interrupted){
      this.root.querySelector('.exp-resume').textContent='Этот нырок сохранён в несовместимом или повреждённом формате. Прежние находки на лодке сохранены; продолжение — с подготовки.';

.dive-transition {
  position: fixed;
  inset: 0;
  z-index: 10000;
  overflow: hidden;
  pointer-events: auto;
  touch-action: none;
  isolation: isolate;
}
.dive-transition[hidden] {display: none !important}
.dive-transition-veil {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
}
.dive-transition[data-phase=closing] .dive-transition-veil {
  opacity: 1;
  transition: opacity var(--dive-fade-out) ease-in;
}
.dive-transition[data-phase=submerged] .dive-transition-veil {opacity: 1}
.dive-transition[data-phase=opening] .dive-transition-veil {
  opacity: 0;
  transition: opacity var(--dive-fade-in) ease-out;
}
.dive-transition-water {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 8%, #b7e7db30, #12627518 48%, transparent 76%);
}
.dive-transition[data-phase=opening]:not(.reduced-motion) .dive-transition-water {
  animation: dive-water-clear var(--dive-fade-in) ease-out both;
}
.dive-transition-water i {
  --size: calc(9px + var(--bubble) * 3px);
  position: absolute;
  left: calc(12% + var(--bubble) * 9%);
  bottom: calc(-35px + var(--bubble) * 6px);
  width: var(--size);
  height: var(--size);
  border: 1px solid #bfe9e28c;
  border-radius: 48% 53% 46% 55%;
  box-shadow: inset 2px 3px 3px #d3ffff28;
}
.dive-transition[data-phase=opening]:not(.reduced-motion) .dive-transition-water i {
  animation: dive-entry-bubble var(--dive-fade-in) ease-out both;
}
@keyframes dive-water-clear {
  0% {opacity: 0}
  20% {opacity: .8}
  100% {opacity: 0}
}
@keyframes dive-entry-bubble {
  from {transform: translateY(0) scale(.7)}
  to {transform: translateY(-48vh) translateX(calc(var(--bubble) * 4px - 16px)) scale(1.4)}
}
@media (prefers-reduced-motion: reduce) {
  .dive-transition-water {display: none}
}
