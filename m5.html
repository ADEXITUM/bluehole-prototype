        <details class="help"><summary>Справка: линия, муть, отказы, газы, клавиши</summary>
          <h4>Линия</h4><ul>
            <li>Привяжи катушку (${z.REEL_M} м, с запасной +${z.SPARE_M}) к ходовой или старой линии — «привязка» (E). Дальше линия тянется за тобой.</li>
            <li><b>Обвязывай на поворотах</b> — «обвязка» (E) у стены. Без обвязки линия за углом уходит в камень, и на выходе по ней не пройти.</li>
            <li>Свою катушку начинай <b>у конца старой линии</b> — уйдёшь дальше.</li>
            <li>Катушка кончилась — линия держит (рывок, звук, пустое кольцо). Вернись или «отцепить» (E, держать): конец закреплён, дальше без линии. Это риск.</li>
            <li>Стрелка (Q) — на любую линию в галерее, где решишь (не ближе ${Xt.MIN_GAP_M} м к другой; с собой ${Xt.COUNT}), указывает к выходу.</li>
          </ul>
          <h4>Ход и муть</h4><ul>
            <li><b>Медленно — чисто.</b> Shift или малый стик не мутят, пока не касаешься камня. Касание мутит тем гуще, чем быстрее.</li>
            <li>Рывок (пробел, ~${J.V_MAX_X.toFixed(1)} м/с вместо ${(J.V_MAX_X*ye.SPEED_K).toFixed(1)}) поднимает муть с камня рядом; над илом мутят и сильные удары ласт.</li>
            <li>В плотной мути не видно ничего дальше полуметра. Держись за линию: тик слева или справа — сторона выхода. Нащупывай стрелки.</li>
          </ul>
          <h4>Отказы</h4><ul>
            <li><b>Шипение и струйка пузырей у регулятора</b> — свободная подача. «Вентиль» (V, держать ~${le.HOLD_S.toFixed(0)} с, плыть нельзя). Не закрыл — газ уходит в ${le.MULT} раза быстрее. Закрыл сразу — потерял только струйку.</li>
            <li><b>Фонарь моргает и трещит</b> — сейчас погаснет совсем. Запасной есть у всех: «фонарь» (L) — ${rt.SPARE_RANGE_M} м, со слотом «мощный запасной» — ${rt.SPARE_HI_RANGE_M} м. Без света держись за линию: тик и подсветка, как в мути.</li>
            <li><b>Линия дёрнулась у обвязки</b> — петля зацепила. «Распутать» (R): сразу — ~${Mt.WARN_HOLD_S.toFixed(0)} с, затянулась — ~${Mt.HOLD_S.toFixed(0)} с. Дёргаться в петле — мутно и тяжело.</li>
          </ul>
          <h4>Газы и MOD</h4><ul>
            <li>MOD на строке газа — его предел глубины. Глубже — отравление: ${me.SYMPTOMS_MIN_S}–${me.SYMPTOMS_MAX_S} с признаков, потом судороги. Спасают безопасный газ или подъём.</li>
            <li>Смена — удержание строки ~${K.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала.</b> Оставить его: перейди на донный, потом «оставить здесь» — встанет на линию. На выходе у баллона — «подобрать», потом перейди на него.</li>
            <li><b>«Подобрать» только пристёгивает баллон</b> — дышишь тем же. Дышать им — отдельной сменой газа: на лежащий баллон без подбора не перейти.</li>
            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь: отдельный блок под газами, держать ~${K.DROP_HOLD_S.toFixed(1)} с. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
            <li>EAN50 (MOD ${Be($t.ean50).toFixed(0)} м): у ходовой около ${K.DECO_CLIP_DEPTH_M} м — кнопка «оставить», можно и нести с собой. На подъёме — выбери его строку; оставил на линии — подплыви, «подобрать», потом смени газ.</li>
