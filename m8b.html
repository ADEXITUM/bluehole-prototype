        <details class="help"><summary>Справка: карта, линия, муть, отказы, газы, клавиши</summary>
          <p class="note dim">P2 · ${ao.STAGE} — один нырок: план, спуск по шахте, галерея вглубь с 33 до 40 м — линия, стрелки, муть, течение и отказы, подъём с деко и сменой газа.</p>
          <h4>Карта</h4><ul>
            <li>Карта — то, что ты рассказал на лодке. Где побывал свет фонаря и что было в кадре, там старая схема исследователя сменяется точной съёмкой. Копится за сезон.</li>
            <li>Погиб — разведанное этого нырка на карту не ложится, как и находки: видел, но не рассказал.</li>
            <li>«?» — там, где разведанная вода уходит в неразведанную. Линии глубин — справочные: где газ или наркоз становятся опасны.</li>
            <li>Коснись карты — откроется целиком: тяни пальцем, щипком — масштаб; на ПК — мышью и колесом. Записку можно перечитать, коснувшись её значка.</li>
          </ul>
          <h4>Линия</h4><ul>
            <li>Привяжи катушку (${V.REEL_M} м, с запасной +${V.SPARE_M}) к ходовой или старой линии — «привязка» (E). Дальше линия тянется за тобой.</li>
            <li><b>Обвязывай на поворотах</b> — «обвязка» (E) у стены. Без обвязки линия за углом уходит в камень, и на выходе по ней не пройти.</li>
            <li>Свою катушку начинай <b>у конца старой линии</b> — уйдёшь дальше. Старая линия обрывается в илистом зале: там последняя стрелка исследователя. Дальше — только своя.</li>
            <li>Катушка кончилась — линия держит (рывок, звук, пустое кольцо). Вернись или «отцепить» (E, держать): конец закреплён, дальше без линии. Это риск.</li>
            <li>Стрелка (Q) — на любую линию в галерее, где решишь (не ближе ${ue.MIN_GAP_M} м к другой; с собой ${ue.COUNT}), указывает к выходу.</li>
            <li><b>Своя линия остаётся в воде</b> между нырками сезона — с обвязками и стрелками (и после гибели: её никто не сматывал). Привяжи катушку к её концу — продолжишь. «Новый сезон» её убирает.</li>
          </ul>
          <h4>Ход и муть</h4><ul>
            <li><b>Медленно — чисто.</b> Shift или малый стик не мутят, пока не касаешься камня. Касание мутит тем гуще, чем быстрее.</li>
            <li>Волна от ласт тем сильнее, чем быстрее ход: посередине хода полный ход чист, у пола и над илом поднимает муть, в узком проходе — густо.</li>
            <li>Рывок (пробел, ~${et.V_MAX_X.toFixed(1)} м/с вместо ${(et.V_MAX_X*Ae.SPEED_K).toFixed(1)}) — чтобы быстро уйти: дышится в ${Fe.GAS_MULT.toFixed(0)} раза тяжелее, метр пути выходит в ~${(Fe.GAS_MULT*Ae.SPEED_K/Fe.SPEED_K).toFixed(1)} раза дороже по газу.</li>
            <li>В плотной мути не видно ничего дальше полуметра. Держись за линию: тик слева или справа — сторона выхода. Нащупывай стрелки.</li>
          </ul>
          <h4>Отказы</h4><ul>
            <li>Карта колоды тянется каждые ${le.EVERY_M} м пути в галерее (первая — на ${le.FIRST_M} м), туда и обратно. Сначала предупреждение — звук и картинка, через несколько секунд — сам отказ.</li>
            <li><b>Шипение и струйка пузырей у регулятора</b> — свободная подача. «Вентиль» (V, держать ~${Be.HOLD_S.toFixed(0)} с, плыть нельзя). Не закрыл — газ уходит в ${Be.MULT} раза быстрее. Закрыл сразу — потерял только струйку.</li>
            <li><b>Фонарь моргает и трещит</b> — сейчас погаснет совсем. Запасной есть у всех: «фонарь» (L) — ${gt.SPARE_RANGE_M} м, со слотом «мощный запасной» — ${gt.SPARE_HI_RANGE_M} м. Без света держись за линию: тик и подсветка, как в мути.</li>
            <li><b>Линия дёрнулась у обвязки</b> — петля зацепила. «Распутать» (R): сразу — ~${Rt.WARN_HOLD_S.toFixed(0)} с, затянулась — ~${Rt.HOLD_S.toFixed(0)} с. Дёргаться в петле — мутно и тяжело.</li>
          </ul>
          <h4>Газы и MOD</h4><ul>
            <li>MOD на строке газа — его предел глубины. Глубже — отравление: ${Qe.SYMPTOMS_MIN_S}–${Qe.SYMPTOMS_MAX_S} с признаков, потом судороги. Спасают безопасный газ или подъём.</li>
            <li>Смена — удержание строки ~${Q.SWITCH_HOLD_S.toFixed(0)} с. Ошибся — список ещё открыт: сразу держи нужную строку.</li>
            <li><b>Стейджем дышат с начала — до его отметки разворота</b> (на манометре стейджа, появится на входе в галерею). Где она наступила, перейди на донный и «оставить здесь» — встанет на линию. Оставленный у входа стейдж на заходе не работает. На выходе у баллона — «подобрать», потом перейди на него.</li>
            <li><b>«Подобрать» только пристёгивает баллон</b> — дышишь тем же. Дышать им — отдельной сменой газа: на лежащий баллон без подбора не перейти.</li>
            <li>«Оставить здесь» есть у любого баллона, кроме того, которым дышишь: отдельный блок под газами, держать ~${Q.DROP_HOLD_S.toFixed(1)} с. У линии — пристегнёшь, без линии — бросишь: утонет на дно.</li>
            <li>EAN50 (MOD ${sn(ie.ean50).toFixed(0)} м): у ходовой около ${Q.DECO_CLIP_DEPTH_M} м — кнопка «оставить», можно и нести с собой. На подъёме — выбери его строку; оставил на линии — подплыви, «подобрать», потом смени газ.</li>
          </ul>
          <h4>Клавиши</h4><ul>
            <li>Телефон: коснись где угодно — там джойстик. Кнопки справа внизу видны, только когда действие возможно.</li>
            <li>Автоплыв (F) — по известной линии: на спуске вниз по ходовой; в галерее — по старой и своей линии, туда, куда смотришь вдоль линии (к концу знакомого или к выходу). По знакомой линии (старой и своей из прошлых нырков) время идёт ×${Mt.KNOWN_SCALE}: газ и деко — честно, просто быстрее. Ход стика (осмотр фонарём — нет), кнопки, тревога, отказ, муть, конец знакомой линии — сразу ×1.</li>
            <li>ПК: WASD или стрелки, Shift — медленно; F — автоплыв; пробел — рывок; E — привязка, обвязка, «отцепить»; Q — стрелка; C — подобрать баллон рядом; T — прочесть записку рядом (и закрыть); M — звук.</li>
